<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hany ♥</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&display=swap');


    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --accent: #ff4477;
      --accent-soft: #ff99bb;
      --mood-glow: rgba(255, 68, 119, 0.14);
    }

    html,
    body {
      height: 100%;
      background: #0a0a0f;
      font-family: 'Fira Code', 'Courier New', monospace;
      color: #ffccdd;
      overflow: hidden;
    }

    #canvas-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .app-shell {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 760px;
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: 12px 16px 14px;
      gap: 8px;
    }

    /* ── Top Header ── */
    .top-bar {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .back-btn {
      justify-self: start;
      color: #ff6688;
      text-decoration: none;
      font-size: 12px;
      padding: 6px 12px;
      border: 1px solid rgba(255, 102, 136, 0.3);
      border-radius: 8px;
      background: rgba(255, 20, 60, 0.06);
      transition: all 0.25s ease;
      white-space: nowrap;
    }

    .back-btn:hover {
      background: rgba(255, 20, 60, 0.16);
      border-color: rgba(255, 102, 136, 0.65);
      text-shadow: 0 0 10px rgba(255, 102, 136, 0.55);
    }

    .title-wrap {
      text-align: center;
    }

    .page-title {
      color: #ff4477;
      font-size: clamp(16px, 3vw, 20px);
      letter-spacing: 3px;
      text-shadow: 0 0 14px rgba(255, 68, 119, 0.6);
    }

    .page-subtitle {
      color: #ff99bb;
      font-size: 10px;
      letter-spacing: 1.5px;
      opacity: 0.65;
      margin-top: 2px;
    }

    .mood-pill {
      justify-self: end;
      font-size: 10px;
      color: #ffb3cc;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 102, 136, 0.25);
      background: rgba(255, 20, 60, 0.06);
      letter-spacing: 0.8px;
      white-space: nowrap;
      transition: all 0.35s ease;
    }

    /* ── Interactive Kitty Stage ── */
    .cat-stage {
      position: relative;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px 12px 8px;
      border-radius: 16px;
      border: 1px solid rgba(255, 80, 120, 0.16);
      background: radial-gradient(circle at 50% 55%, var(--mood-glow), rgba(255, 20, 60, 0.02) 65%, transparent);
      cursor: pointer;
      user-select: none;
      transition: background 0.6s ease, border-color 0.4s ease, transform 0.2s ease;
    }

    .cat-stage:hover {
      border-color: rgba(255, 102, 136, 0.34);
    }

    .cat-stage:active {
      transform: scale(0.992);
    }

    #hany-cat {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-variant-ligatures: none;
      font-feature-settings: "liga" 0, "calt" 0;
      font-size: clamp(10.5px, 2.25vw, 14.5px);
      line-height: 1.18;
      letter-spacing: 0px;
      white-space: pre;
      text-align: left;
      color: #ffdbe7;
      text-shadow: 0 0 6px rgba(255, 219, 231, 0.35);
      pointer-events: none;
    }

    /* Lock non-ASCII glyphs to exact 1 monospace column so alignment NEVER breaks */
    .cw {
      display: inline-block;
      width: 1ch;
      text-align: center;
      line-height: inherit;
      vertical-align: baseline;
    }

    /* Kitty colors */
    .c-fur {
      color: #ffe3ee;
      text-shadow: 0 0 7px rgba(255, 210, 228, 0.45);
    }

    .c-shade {
      color: #e59ab4;
      text-shadow: 0 0 5px rgba(229, 154, 180, 0.4);
    }

    .c-ear {
      color: #ff85a8;
      text-shadow: 0 0 8px rgba(255, 133, 168, 0.65);
    }

    .c-flower {
      color: #ff6699;
      text-shadow: 0 0 10px rgba(255, 102, 153, 0.85);
    }

    .c-eye {
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.95);
    }

    .c-mouth {
      color: #ff7096;
      text-shadow: 0 0 8px rgba(255, 112, 150, 0.7);
    }

    .c-blush {
      color: #ff4778;
      text-shadow: 0 0 11px rgba(255, 71, 120, 0.85);
    }

    .c-heart {
      color: #ff1e42;
      text-shadow: 0 0 14px rgba(255, 30, 66, 0.95);
    }

    .c-spark {
      color: #ffe066;
      text-shadow: 0 0 11px rgba(255, 224, 102, 0.85);
    }

    .c-tear {
      color: #7ec8ff;
      text-shadow: 0 0 10px rgba(126, 200, 255, 0.85);
    }

    .c-angry {
      color: #ff3b3b;
      text-shadow: 0 0 12px rgba(255, 59, 59, 0.9);
    }

    .c-zzz {
      color: #a7b8ff;
      text-shadow: 0 0 10px rgba(167, 184, 255, 0.8);
    }

    .c-note {
      color: #ff85d0;
      text-shadow: 0 0 10px rgba(255, 133, 208, 0.8);
    }

    .c-shadow {
      color: rgba(255, 153, 187, 0.28);
    }

    .stage-hint {
      font-size: 9px;
      color: rgba(255, 170, 198, 0.48);
      letter-spacing: 1px;
      margin-top: 2px;
      transition: opacity 0.4s ease;
    }

    /* ── Chat Area ── */
    .chat-container {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      border-radius: 16px;
      border: 1px solid rgba(255, 68, 102, 0.16);
      background: rgba(16, 12, 20, 0.65);
      backdrop-filter: blur(6px);
      overflow: hidden;
    }

    .chat-messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 68, 102, 0.32) transparent;
    }

    .chat-messages::-webkit-scrollbar {
      width: 5px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(255, 68, 102, 0.32);
      border-radius: 4px;
    }

    .msg {
      max-width: 84%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 12px;
      line-height: 1.65;
      animation: msgAppear 0.32s cubic-bezier(0.22, 1, 0.36, 1) both;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }

    @keyframes msgAppear {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .msg-user {
      align-self: flex-end;
      background: rgba(255, 68, 102, 0.16);
      border: 1px solid rgba(255, 68, 102, 0.28);
      color: #ffe0ea;
      border-bottom-right-radius: 4px;
    }

    .msg-ai {
      align-self: flex-start;
      background: rgba(255, 170, 200, 0.08);
      border: 1px solid rgba(255, 170, 200, 0.2);
      color: #ffd6e5;
      border-bottom-left-radius: 4px;
    }

    .msg-ai .msg-name {
      color: #ff6699;
      font-size: 10px;
      font-weight: 600;
      margin-bottom: 4px;
      display: block;
      letter-spacing: 0.6px;
    }

    .msg-error {
      border-color: rgba(255, 120, 100, 0.35);
      background: rgba(255, 60, 60, 0.08);
    }

    .msg-typing {
      align-self: flex-start;
      color: #ff99bb;
      font-size: 12px;
      opacity: 0.78;
      padding: 8px 14px;
    }

    .typing-dots span {
      animation: typingDot 1.4s infinite;
      display: inline-block;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes typingDot {

      0%,
      60%,
      100% {
        opacity: 0.25;
        transform: translateY(0);
      }

      30% {
        opacity: 1;
        transform: translateY(-4px);
      }
    }

    /* ── Input Area ── */
    .input-area {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 12px;
      border-top: 1px solid rgba(255, 68, 102, 0.16);
      background: rgba(12, 10, 16, 0.7);
    }

    .chat-input {
      flex: 1;
      background: rgba(255, 20, 60, 0.06);
      border: 1px solid rgba(255, 68, 102, 0.26);
      border-radius: 12px;
      padding: 11px 14px;
      color: #ffe0ea;
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      line-height: 1.45;
      outline: none;
      transition: border-color 0.25s ease, background 0.25s ease;
      resize: none;
      min-height: 42px;
      max-height: 110px;
    }

    .chat-input::placeholder {
      color: rgba(255, 153, 187, 0.42);
    }

    .chat-input:focus {
      border-color: rgba(255, 68, 102, 0.58);
      background: rgba(255, 20, 60, 0.09);
    }

    .send-btn {
      background: rgba(255, 68, 102, 0.2);
      border: 1px solid rgba(255, 68, 102, 0.38);
      border-radius: 12px;
      color: #ff6688;
      font-family: 'Fira Code', monospace;
      font-size: 17px;
      height: 42px;
      padding: 0 16px;
      cursor: pointer;
      transition: all 0.25s ease;
      flex-shrink: 0;
    }

    .send-btn:hover:not(:disabled) {
      background: rgba(255, 68, 102, 0.35);
      text-shadow: 0 0 10px rgba(255, 68, 102, 0.75);
    }

    .send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* ── Ambient Petals & Click Hearts ── */
    .falling-petal {
      position: fixed;
      pointer-events: none;
      z-index: 2;
      animation: fall linear forwards;
      opacity: 0;
    }

    @keyframes fall {
      0% {
        transform: translateY(-30px) rotate(0deg) translateX(0);
        opacity: 0;
      }

      8% {
        opacity: 0.68;
      }

      50% {
        transform: translateY(50vh) rotate(360deg) translateX(-18px);
      }

      100% {
        transform: translateY(105vh) rotate(720deg) translateX(10px);
        opacity: 0;
      }
    }

    .float-heart {
      position: fixed;
      pointer-events: none;
      z-index: 5;
      animation: floatUp 2.2s ease-out forwards;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.6);
        opacity: 0;
      }

      18% {
        opacity: 1;
        transform: translateY(-14px) scale(1.1);
      }

      100% {
        transform: translateY(-110px) scale(0.4) rotate(14deg);
        opacity: 0;
      }
    }

    /* ── Mobile Responsive Polish ── */
    @media (max-width: 560px) {
      .app-shell {
        padding: 10px 10px 12px;
        gap: 6px;
      }

      .top-bar {
        grid-template-columns: auto 1fr auto;
      }

      .back-btn {
        font-size: 11px;
        padding: 5px 9px;
      }

      .mood-pill {
        font-size: 9px;
        padding: 4px 8px;
      }

      .page-subtitle {
        display: none;
      }

      .cat-stage {
        padding: 8px 6px 6px;
      }

      .msg {
        max-width: 92%;
        font-size: 11.5px;
      }
    }
  </style>
</head>

<body>
  <canvas id="canvas-bg"></canvas>

  <div class="app-shell">
    <header class="top-bar">
      <a href="index.html" class="back-btn">← bouquet</a>
      <div class="title-wrap">
        <div class="page-title">♥ Hany ♥</div>
        <div class="page-subtitle">wispy · right here with you</div>
      </div>
      <div class="mood-pill" id="mood-pill">♡ happy</div>
    </header>

    <section class="cat-stage" id="cat-stage" title="Click to give Hany some love ♥">
      <pre id="hany-cat"></pre>
      <div class="stage-hint" id="stage-hint">tap Hany to make her smile ♥</div>
    </section>

    <main class="chat-container">
      <div class="chat-messages" id="chat-messages"></div>
      <div class="input-area">
        <textarea class="chat-input" id="chat-input" placeholder="talk to Hany..." rows="1"></textarea>
        <button class="send-btn" id="send-btn" title="Send">♥</button>
      </div>
    </main>
  </div>

  <script>
    // ══════════════════════════════════════════════════════════════
    //   Background Starfield + Falling Petals + Mouse Aura
    // ══════════════════════════════════════════════════════════════
    const cvs = document.getElementById('canvas-bg');
    const cx = cvs.getContext('2d');
    const stars = [];

    function resizeCanvas() {
      cvs.width = innerWidth;
      cvs.height = innerHeight;
    }
    resizeCanvas();
    addEventListener('resize', resizeCanvas);

    for (let i = 0; i < 85; i++) {
      stars.push({
        x: Math.random() * innerWidth,
        y: Math.random() * innerHeight,
        r: Math.random() * 1.2 + 0.3,
        a: Math.random(),
        spd: Math.random() * 0.012 + 0.004,
        d: Math.random() > 0.5 ? 1 : -1
      });
    }

    (function drawStars() {
      cx.clearRect(0, 0, cvs.width, cvs.height);
      for (const s of stars) {
        s.a += s.spd * s.d;
        if (s.a >= 1) { s.a = 1; s.d = -1; }
        if (s.a <= 0.08) { s.a = 0.08; s.d = 1; }
        cx.beginPath();
        cx.arc(s.x, s.y, s.r, 0, 6.283);
        cx.fillStyle = `rgba(255,160,190,${s.a * 0.42})`;
        cx.fill();
      }
      requestAnimationFrame(drawStars);
    })();

    setInterval(() => {
      const p = document.createElement('div');
      p.className = 'falling-petal';
      p.textContent = ['❀', '✿', '♥', '✦', '❁'][(Math.random() * 5) | 0];
      p.style.left = Math.random() * 100 + 'vw';
      p.style.fontSize = (Math.random() * 11 + 8) + 'px';
      p.style.animationDuration = (Math.random() * 5 + 7) + 's';
      p.style.color = `hsl(${345 + Math.random() * 25}, 80%, ${55 + Math.random() * 20}%)`;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 13000);
    }, 1200);

    // ══════════════════════════════════════════════════════════════
    //   2D ASCII KITTY COMPOSITOR & CHOREOGRAPHY ENGINE
    //   Grid: 42 columns x 14 rows
    // ══════════════════════════════════════════════════════════════
    const ROWS = 14;
    const COLS = 42;
    const catEl = document.getElementById('hany-cat');
    const moodPill = document.getElementById('mood-pill');
    const catStage = document.getElementById('cat-stage');
    const stageHint = document.getElementById('stage-hint');

    const charGrid = Array.from({ length: ROWS }, () => new Array(COLS).fill(' '));
    const clsGrid = Array.from({ length: ROWS }, () => new Array(COLS).fill(''));

    function clearGrid() {
      for (let r = 0; r < ROWS; r++) {
        charGrid[r].fill(' ');
        clsGrid[r].fill('');
      }
    }

    function putChar(r, c, ch, cls = 'c-fur') {
      if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return;
      charGrid[r][c] = ch;
      clsGrid[r][c] = cls;
    }

    function putStr(r, c, str, cls = 'c-fur') {
      for (let i = 0; i < str.length; i++) {
        const ch = str[i];
        if (ch !== ' ') putChar(r, c + i, ch, cls);
      }
    }

    // Writes string INCLUDING spaces (useful to erase behind an overlay)
    function stampStr(r, c, str, cls = 'c-fur') {
      for (let i = 0; i < str.length; i++) {
        if (r >= 0 && r < ROWS && c + i >= 0 && c + i < COLS) {
          charGrid[r][c + i] = str[i];
          clsGrid[r][c + i] = str[i] === ' ' ? '' : cls;
        }
      }
    }

    // ── Emotion Mood Profiles ──
    const MOODS = {
      neutral: { label: '♡ calm', glow: 'rgba(255, 110, 155, 0.12)', eyes: ['•', '•'], mouth: 'w', cheeks: 'none', earStyle: 'up', tail: 'normal', particle: 'sparkle', blinkRate: 44 },
      happy: { label: '♥ happy', glow: 'rgba(255, 80, 130, 0.18)', eyes: ['^', '^'], mouth: 'w', cheeks: 'blush', earStyle: 'up', tail: 'fast', particle: 'heart', blinkRate: 38 },
      love: { label: '♥ in love', glow: 'rgba(255, 30, 80, 0.24)', eyes: ['♥', '♥'], mouth: 'w', cheeks: 'blush', earStyle: 'up', tail: 'heart', particle: 'love', blinkRate: 52 },
      shy: { label: '♡ flustered', glow: 'rgba(255, 70, 120, 0.22)', eyes: ['^', '^'], mouth: 'ω', cheeks: 'blush', earStyle: 'up', tail: 'slow', particle: 'heart', blinkRate: 34 },
      playful: { label: '♪ playful', glow: 'rgba(255, 100, 180, 0.18)', eyes: ['~', '^'], mouth: 'ω', cheeks: 'blush', earStyle: 'up', tail: 'fast', particle: 'note', blinkRate: 32 },
      excited: { label: '★ excited', glow: 'rgba(255, 195, 70, 0.20)', eyes: ['★', '★'], mouth: '▽', cheeks: 'blush', earStyle: 'alert', tail: 'fast', particle: 'sparkle', blinkRate: 30 },
      surprised: { label: '! surprised', glow: 'rgba(255, 175, 90, 0.20)', eyes: ['O', 'O'], mouth: 'o', cheeks: 'none', earStyle: 'alert', tail: 'puff', particle: 'sparkle', blinkRate: 60 },
      thinking: { label: '? curious', glow: 'rgba(180, 150, 255, 0.15)', eyes: ['•', 'o'], mouth: '~', cheeks: 'none', earStyle: 'tilt', tail: 'quest', particle: 'quest', blinkRate: 46 },
      confused: { label: '? confused', glow: 'rgba(170, 145, 255, 0.16)', eyes: ['o', 'O'], mouth: '~', cheeks: 'none', earStyle: 'tilt', tail: 'quest', particle: 'quest', blinkRate: 40 },
      sad: { label: '· sad', glow: 'rgba(100, 160, 255, 0.16)', eyes: [';', ';'], mouth: 'n', cheeks: 'tears', earStyle: 'droop', tail: 'droop', particle: 'tear', blinkRate: 55 },
      sleepy: { label: 'z sleepy', glow: 'rgba(130, 145, 255, 0.15)', eyes: ['-', '-'], mouth: 'w', cheeks: 'none', earStyle: 'droop', tail: 'slow', particle: 'zzz', blinkRate: 24 },
      angry: { label: '! pouty', glow: 'rgba(255, 55, 55, 0.20)', eyes: ['>', '<'], mouth: 'n', cheeks: 'angry', earStyle: 'flat', tail: 'puff', particle: 'angry', blinkRate: 65 },
    };

    // ── Live Kitty State ──
    const kitty = {
      emotion: 'happy',
      tick: 0,
      blinkPhase: 0,     // 0=open, 1=closing, 2=closed, 3=opening
      blinkTimer: 26,
      lookDir: 0,        // -1 left, 0 center, +1 right (tracks mouse!)
      typingActive: false,
      typingSweet: false,
      typingTimer: 0,
      talkTicks: 0,      // animates mouth talking when message arrives
      actionQueue: [],   // sequence of { pose, ticks, eyeOverride?, mouthOverride?, rOff?, cOff? }
      particles: [],     // { r, c, ch, cls, dr, life, maxLife }
      tears: [],         // { r, c, stage }
      idleCooldown: 35,  // countdown to random cute idle micro-action
    };

    // ── Drawing Helpers for Kitty Parts ──
    // Sitting kitty origin: baseR = 4, baseC = 11 (head spans cols 11..25, center = 18)
    function drawKittyHead(r, c, opts = {}) {
      const mood = MOODS[kitty.emotion] || MOODS.neutral;
      const earStyle = opts.earStyle || mood.earStyle || 'up';

      // Ears (row +0 and +1)
      if (earStyle === 'droop' || earStyle === 'flat') {
        putStr(r + 0, c + 1, '._       _.', 'c-fur');
        putStr(r + 1, c + 1, '/  `\\___/\'  \\', 'c-fur');
        putChar(r + 1, c + 4, '`', 'c-shade');
        putChar(r + 1, c + 10, '\'', 'c-shade');
      } else if (earStyle === 'alert') {
        putStr(r + 0, c + 2, '/|\\     /|\\', 'c-fur');
        putStr(r + 1, c + 1, '/ ^ \\___/ ^ \\', 'c-fur');
        putChar(r + 1, c + 3, '^', 'c-ear');
        putChar(r + 1, c + 11, '^', 'c-ear');
      } else if (earStyle === 'tilt') {
        putStr(r + 0, c + 2, '._     _/\\', 'c-fur');
        putStr(r + 1, c + 1, '/ ~ \\___/ ^ \\', 'c-fur');
        putChar(r + 1, c + 3, '~', 'c-ear');
        putChar(r + 1, c + 11, '^', 'c-ear');
      } else {
        let earL = '/\\_';
        let earR = '_/\\';
        // Subtle random ear flick when idle
        if (opts.twitch === 'L') earL = '/\\~';
        if (opts.twitch === 'R') earR = '~/\\';
        putStr(r + 0, c + 2, earL + '     ' + earR, 'c-fur');
        putStr(r + 1, c + 1, '/ ^ \\___/ ^ \\', 'c-fur');
        putChar(r + 1, c + 3, '^', 'c-ear');
        putChar(r + 1, c + 11, '^', 'c-ear');
      }
      // Cute flower tucked behind her ear!
      putChar(r + 0, earStyle === 'tilt' ? c + 12 : c + 13, '✿', 'c-flower');

      // Round cheeks & whiskers (rows +2, +3)
      putStr(r + 2, c + 0, '(             )', 'c-fur');
      putStr(r + 3, c - 1, '=(             )=', 'c-fur');
      putChar(r + 3, c - 1, '=', 'c-shade');
      putChar(r + 3, c + 15, '=', 'c-shade');

      // Eyes (with blink & cursor look offset!)
      let [eyeL, eyeR] = opts.eyes || mood.eyes;
      let eyeShift = 0;
      if (!opts.noLook && kitty.blinkPhase === 0 && (eyeL === '•' || eyeL === 'o' || eyeL === '●')) {
        eyeShift = kitty.lookDir;
      }
      if (kitty.blinkPhase === 1 || kitty.blinkPhase === 3) {
        eyeL = '-'; eyeR = '-';
      } else if (kitty.blinkPhase === 2) {
        eyeL = '_'; eyeR = '_';
      }
      // Cute winking animation for playful mood
      if (kitty.emotion === 'playful' && !opts.eyes && kitty.blinkPhase === 0) {
        if (kitty.tick % 24 >= 12) { const tmp = eyeL; eyeL = eyeR; eyeR = tmp; }
      }
      const eyeCls = (eyeL === '♥') ? 'c-heart' : (eyeL === '★') ? 'c-spark' : 'c-eye';
      putChar(r + 2, c + 4 + eyeShift, eyeL, eyeCls);
      putChar(r + 2, c + 10 + eyeShift, eyeR, eyeCls);

      // Cheeks / Whiskers / Blush
      const cheekType = opts.cheeks || (kitty.typingSweet ? 'blush' : mood.cheeks);
      if (cheekType === 'blush') {
        putStr(r + 3, c + 2, '//', 'c-blush');
        putStr(r + 3, c + 11, '\\\\', 'c-blush');
      } else if (cheekType === 'angry') {
        putStr(r + 3, c + 2, '##', 'c-angry');
        putStr(r + 3, c + 11, '##', 'c-angry');
      } else if (cheekType === 'tears') {
        putChar(r + 3, c + 2, '=', 'c-shade');
        putChar(r + 3, c + 12, '=', 'c-shade');
        putChar(r + 3, c + 4, (kitty.tick % 4 < 2) ? '\'' : ',', 'c-tear');
        putChar(r + 3, c + 10, (kitty.tick % 4 < 2) ? ',' : '\'', 'c-tear');
      } else {
        putStr(r + 3, c + 2, '==', 'c-shade');
        putStr(r + 3, c + 11, '==', 'c-shade');
      }

      // Mouth (with talking & occasional blep/smile animations!)
      let mouth = opts.mouth || mood.mouth;
      if (kitty.talkTicks > 0) {
        const talkSeq = ['w', 'o', 'ω', '▽'];
        mouth = talkSeq[kitty.tick % talkSeq.length];
      } else if (!opts.mouth && kitty.emotion === 'playful' && kitty.tick % 26 < 4) {
        mouth = 'p'; // cute kitty blep!
      }
      putChar(r + 3, c + 7, mouth, 'c-mouth');

      // Chin (row +4)
      putStr(r + 4, c + 1, '\\   `---\'   /', 'c-fur');
      putStr(r + 4, c + 5, '`---\'', 'c-shade');
    }

    function drawKittyTail(r, c, mode) {
      const t = kitty.tick;
      if (mode === 'droop') {
        putStr(r + 7, c + 14, '_____', 'c-shade');
        return;
      }
      if (mode === 'puff') {
        const sway = (t % 4 < 2) ? 0 : 1;
        putStr(r + 4, c + 18 + sway, '/\\', 'c-fur');
        putStr(r + 5, c + 17 + sway, '///', 'c-shade');
        putStr(r + 6, c + 17, '///', 'c-shade');
        putStr(r + 7, c + 14, '___/', 'c-fur');
        return;
      }
      if (mode === 'quest') {
        putStr(r + 5, c + 17, '.-?', 'c-spark');
        putStr(r + 6, c + 16, '|', 'c-fur');
        putStr(r + 7, c + 14, '__.\'', 'c-fur');
        return;
      }
      if (mode === 'heart') {
        const bob = (t % 8 < 4) ? 0 : 1;
        putStr(r + 5 - bob, c + 17, '~♥', 'c-heart');
        putChar(r + 5 - bob, c + 17, '~', 'c-fur');
        putStr(r + 6, c + 16, '/', 'c-fur');
        putStr(r + 7, c + 14, '__.\'', 'c-fur');
        return;
      }

      // Smooth 6-frame flowing cat tail (normal / fast / slow)
      const step = mode === 'fast' ? (t % 6) : mode === 'slow' ? (Math.floor(t / 3) % 6) : (Math.floor(t / 2) % 6);
      switch (step) {
        case 0:
          putStr(r + 5, c + 17, '_.-~', 'c-fur');
          putStr(r + 6, c + 16, '/\'', 'c-fur');
          putStr(r + 7, c + 14, '__.\'', 'c-fur');
          break;
        case 1:
          putStr(r + 5, c + 17, '_.-~\'', 'c-fur');
          putStr(r + 6, c + 16, '/\'', 'c-fur');
          putStr(r + 7, c + 14, '__.\'', 'c-fur');
          break;
        case 2:
          putStr(r + 6, c + 16, ' _.-~', 'c-fur');
          putStr(r + 7, c + 14, '__.\'', 'c-fur');
          break;
        case 3:
          putStr(r + 7, c + 14, '~-._.-~', 'c-fur');
          break;
        case 4:
          putStr(r + 6, c + 16, ' ~-.', 'c-fur');
          putStr(r + 7, c + 14, '__.\'', 'c-fur');
          break;
        case 5:
          putChar(r + 5, c + 17, '~', 'c-fur');
          putStr(r + 6, c + 16, '/\'', 'c-fur');
          putStr(r + 7, c + 14, '__.\'', 'c-fur');
          break;
      }
    }

    function drawSittingBody(r, c, variant = 'sit') {
      // Collar + heart charm
      putStr(r + 5, c + 1, '/   ·-♥-·   \\', 'c-fur');
      putStr(r + 5, c + 5, '·- -·', 'c-shade');
      putChar(r + 5, c + 7, '♥', 'c-heart');

      if (variant === 'kneadL') {
        putStr(r + 6, c + 0, '(  (^)  | |   )', 'c-fur');
        putChar(r + 6, c + 4, '^', 'c-ear');
        putStr(r + 7, c + 1, '\\______(_)__/', 'c-fur');
      } else if (variant === 'kneadR') {
        putStr(r + 6, c + 0, '(   | |  (^)  )', 'c-fur');
        putChar(r + 6, c + 10, '^', 'c-ear');
        putStr(r + 7, c + 1, '\\__(_)______/', 'c-fur');
      } else if (variant === 'airPaws') {
        putStr(r + 6, c + 0, '(  (^)   (^)  )', 'c-fur');
        putChar(r + 6, c + 4, '^', 'c-ear');
        putChar(r + 6, c + 10, '^', 'c-ear');
        putStr(r + 7, c + 1, '\\___________/', 'c-fur');
      } else {
        putStr(r + 6, c + 0, '(   | | | |   )', 'c-fur');
        putStr(r + 7, c + 1, '\\__(_)_(_)__/', 'c-fur');
      }
    }

    // ── Full Pose Renderer ──
    function drawPose(pose, opts = {}) {
      const mood = MOODS[kitty.emotion] || MOODS.neutral;
      const baseR = 4 + (opts.rOff || 0);
      const baseC = 11 + (opts.cOff || 0);
      const tailMode = opts.tailMode || mood.tail;

      // Ground shadow when jumping!
      if ((opts.rOff || 0) < 0) {
        putStr(12, 13, '···········', 'c-shadow');
      }

      switch (pose) {
        case 'sit':
        case 'kneadL':
        case 'kneadR':
        case 'hop': {
          drawKittyHead(baseR, baseC, opts);
          drawSittingBody(baseR, baseC, pose === 'hop' ? 'airPaws' : pose);
          drawKittyTail(baseR, baseC, tailMode);
          break;
        }

        case 'waveL':
        case 'waveM':
        case 'waveH': {
          drawKittyHead(baseR, baseC, opts);
          putStr(baseR + 5, baseC + 1, '/   ·-♥-·   \\', 'c-fur');
          putStr(baseR + 5, baseC + 5, '·- -·', 'c-shade');
          putChar(baseR + 5, baseC + 7, '♥', 'c-heart');
          putStr(baseR + 6, baseC + 0, '(       | |   )', 'c-fur');
          putStr(baseR + 7, baseC + 1, '\\______(_)__/', 'c-fur');
          // Cute kitty paw waving on left side
          if (pose === 'waveL') {
            putStr(baseR + 5, baseC - 3, '_', 'c-fur');
            putStr(baseR + 6, baseC - 4, '( )', 'c-fur');
            putStr(baseR + 7, baseC - 3, '\\__/', 'c-fur');
          } else if (pose === 'waveM') {
            putStr(baseR + 3, baseC - 4, '_', 'c-fur');
            putStr(baseR + 4, baseC - 5, '( )_', 'c-fur');
            putStr(baseR + 5, baseC - 4, '\\_/', 'c-fur');
          } else {
            putStr(baseR + 1, baseC - 4, '_', 'c-fur');
            putStr(baseR + 2, baseC - 5, '( )', 'c-fur');
            putStr(baseR + 3, baseC - 4, '\\ \\', 'c-fur');
            putStr(baseR + 4, baseC - 3, '\\ \\', 'c-fur');
            stampStr(baseR + 5, baseC - 2, '\\_/ ', 'c-fur');
          }
          drawKittyTail(baseR, baseC, tailMode);
          break;
        }

        case 'groom1':
        case 'groom2': {
          drawKittyHead(baseR, baseC, { ...opts, eyes: ['-', mood.eyes[1]], mouth: 'ω', noLook: true });
          putStr(baseR + 5, baseC + 1, '/   ·-♥-·   \\', 'c-fur');
          putStr(baseR + 5, baseC + 5, '·- -·', 'c-shade');
          putChar(baseR + 5, baseC + 7, '♥', 'c-heart');
          putStr(baseR + 6, baseC + 0, '(       | |   )', 'c-fur');
          putStr(baseR + 7, baseC + 1, '\\______(_)__/', 'c-fur');
          // Paw up washing cheek!
          const pawR = (pose === 'groom1') ? baseR + 3 : baseR + 2;
          stampStr(pawR, baseC + 1, '( )', 'c-fur');
          stampStr(pawR + 1, baseC + 1, '`-\'', 'c-shade');
          drawKittyTail(baseR, baseC, tailMode);
          break;
        }

        case 'shyHide':
        case 'shyPeek': {
          const shyEyes = (pose === 'shyPeek') ? ['-', '•'] : ['-', '-'];
          drawKittyHead(baseR + 1, baseC, { ...opts, eyes: shyEyes, mouth: 'ω', cheeks: 'blush', noLook: true });
          putStr(baseR + 5, baseC + 2, '( )     ( )', 'c-fur');
          stampStr(baseR + 6, baseC + 1, '/`-\'·-♥-·`-\'\\', 'c-fur');
          putStr(baseR + 6, baseC + 5, '·- -·', 'c-shade');
          putChar(baseR + 6, baseC + 7, '♥', 'c-heart');
          putStr(baseR + 7, baseC + 0, '(             )', 'c-fur');
          putStr(baseR + 8, baseC + 1, '\\___________/', 'c-fur');
          if (pose === 'shyPeek') {
            stampStr(baseR + 5, baseC + 10, '   ', 'c-fur');
            stampStr(baseR + 6, baseC + 10, '   ', 'c-fur');
          }
          drawKittyTail(baseR + 1, baseC, 'slow');
          break;
        }

        case 'tilt': {
          drawKittyHead(baseR, baseC + 1, { ...opts, earStyle: 'tilt' });
          // Cute paw resting on chin thinking!
          stampStr(baseR + 4, baseC + 2, '( )', 'c-fur');
          stampStr(baseR + 5, baseC + 1, '/`-\' ·-♥-·   \\', 'c-fur');
          putStr(baseR + 5, baseC + 2, '`-\'', 'c-shade');
          putChar(baseR + 5, baseC + 8, '♥', 'c-heart');
          putStr(baseR + 6, baseC + 0, '(       | |   )', 'c-fur');
          putStr(baseR + 7, baseC + 1, '\\______(_)__/', 'c-fur');
          drawKittyTail(baseR, baseC, 'quest');
          break;
        }

        case 'stretchPrep': {
          const sr = baseR + 1;
          drawKittyHead(sr, baseC + 1, { ...opts, eyes: ['-', '-'], mouth: 'o', noLook: true });
          putStr(sr + 4, baseC - 4, '_____', 'c-fur');
          putStr(sr + 5, baseC - 5, '(____)', 'c-fur');
          putStr(sr + 5, baseC + 2, '\\  ·-♥-·  /______', 'c-fur');
          putChar(sr + 5, baseC + 7, '♥', 'c-heart');
          putStr(sr + 6, baseC + 3, '\\_______/_______/', 'c-fur');
          putStr(sr + 7, baseC + 5, '(__)     (__)', 'c-fur');
          drawKittyTail(sr - 1, baseC + 5, 'normal');
          break;
        }

        case 'stretchFull': {
          const sr = baseR + 1;
          // Low stretching kitty with front paws extended forward, back dipping & tail high!
          putStr(sr + 0, baseC + 3, '/\\_     _/\\', 'c-fur');
          putChar(sr + 0, baseC + 14, '✿', 'c-flower');
          putStr(sr + 1, baseC + 2, '/ - \\___/ - \\', 'c-fur');
          putChar(sr + 1, baseC + 4, '-', 'c-ear');
          putChar(sr + 1, baseC + 12, '-', 'c-ear');
          putStr(sr + 2, baseC + 1, '(   -     -   )', 'c-fur');
          putChar(sr + 2, baseC + 5, '-', 'c-eye');
          putChar(sr + 2, baseC + 11, '-', 'c-eye');
          putStr(sr + 3, baseC - 7, '_______=(  ==  O  ==  )=___', 'c-fur');
          putChar(sr + 3, baseC + 8, opts.mouth || 'O', 'c-mouth');
          putStr(sr + 3, baseC + 4, '//', 'c-blush');
          putStr(sr + 3, baseC + 11, '\\\\', 'c-blush');
          putStr(sr + 4, baseC - 8, '(_____)', 'c-fur');
          putStr(sr + 4, baseC + 2, '\\   `---\'   /', 'c-fur');
          putStr(sr + 5, baseC + 3, '\\  ·-♥-·  /_______/', 'c-fur');
          putChar(sr + 5, baseC + 8, '♥', 'c-heart');
          putStr(sr + 6, baseC + 4, '`-(___)-\'   (___)', 'c-fur');
          // High arched tail
          putChar(sr + 0, baseC + 23, '_', 'c-fur');
          putStr(sr + 1, baseC + 22, '/ \\', 'c-fur');
          putStr(sr + 2, baseC + 21, '/  /', 'c-fur');
          putStr(sr + 3, baseC + 20, '/  /', 'c-fur');
          putChar(sr + 4, baseC + 22, '/', 'c-fur');
          break;
        }

        case 'crouch':
        case 'wiggleL':
        case 'wiggleR': {
          const wr = baseR + 1;
          const wig = (pose === 'wiggleR') ? 1 : 0;
          drawKittyHead(wr, baseC, { ...opts, eyes: ['●', '●'], mouth: 'ω', noLook: true });
          // Crouched paws + butt wiggle rear!
          putStr(wr + 4, baseC - 4, '____', 'c-fur');
          putStr(wr + 5, baseC - 5, '(___)\\', 'c-fur');
          putStr(wr + 5, baseC + 2, '\\  ·-♥-·  /', 'c-fur');
          putChar(wr + 5, baseC + 7, '♥', 'c-heart');
          putStr(wr + 5, baseC + 13, (wig ? '________/' : '_______/'), 'c-fur');
          putStr(wr + 6, baseC + 1, '`--\\_______/', 'c-fur');
          putStr(wr + 6, baseC + 14 + wig, '(___)', 'c-fur');
          // Tail wagging high while wiggling!
          putChar(wr + 0, baseC + 23 + wig, '_', 'c-fur');
          putStr(wr + 1, baseC + 22 + wig, '/ \\', 'c-fur');
          putStr(wr + 2, baseC + 21 + wig, '/  /', 'c-fur');
          putStr(wr + 3, baseC + 17, '__/', 'c-fur');
          putChar(wr + 3, baseC + 23 + wig, '/', 'c-fur');
          putChar(wr + 4, baseC + 22 + wig, '/', 'c-fur');
          break;
        }

        case 'curlIn':
        case 'curlOut': {
          const cr = baseR + 2;
          const breath = (pose === 'curlIn') ? 1 : 0;
          drawKittyHead(cr - 1, baseC, { ...opts, earStyle: 'droop', eyes: ['-', '-'], mouth: 'w', noLook: true });
          stampStr(cr + 3, baseC + 0, '/ `-----------\' \\' + (breath ? '____' : '___'), 'c-fur');
          stampStr(cr + 4, baseC - 1, '(    ·--♥--·       ' + (breath ? ' `' : '`') + '-.', 'c-fur');
          putChar(cr + 4, baseC + 7, '♥', 'c-heart');
          stampStr(cr + 5, baseC + 0, '\\__(_)_(_)________' + (breath ? '_.\'' : '.\''), 'c-fur');
          break;
        }

        case 'angryArch': {
          const ar = baseR;
          const shake = (kitty.tick % 2 === 0) ? 0 : 1;
          drawKittyHead(ar, baseC + shake, { ...opts, earStyle: 'flat', eyes: ['>', '<'], mouth: '^', cheeks: 'angry', noLook: true });
          putStr(ar + 5, baseC + 1 + shake, '/  /^^^^^\\  \\', 'c-fur');
          putStr(ar + 5, baseC + 5 + shake, '^^^^^', 'c-angry');
          putStr(ar + 6, baseC + 0 + shake, '(  | |   | |  )', 'c-fur');
          putStr(ar + 7, baseC + 1 + shake, '\\_(_)___(_)__/', 'c-fur');
          drawKittyTail(ar, baseC + shake, 'puff');
          break;
        }

        case 'pout': {
          drawKittyHead(baseR, baseC, {
            ...opts,
            earStyle: 'tilt',
            eyes: opts.eyes || ['•', '-'],
            mouth: opts.mouth || '3',
            cheeks: 'blush',
            noLook: true
          });
          drawSittingBody(baseR, baseC, 'sit');
          drawKittyTail(baseR, baseC, 'fast');
          break;
        }

        case 'drowsyNod': {
          drawKittyHead(baseR + 1, baseC, {
            ...opts,
            earStyle: 'droop',
            eyes: ['-', '-'],
            mouth: opts.mouth || 'w',
            noLook: true
          });
          drawSittingBody(baseR + 1, baseC, 'sit');
          drawKittyTail(baseR + 1, baseC, 'droop');
          break;
        }
      }
    }

    // ── Live ASCII Particles ──
    function spawnParticle(type) {
      const specs = {
        heart: { chars: ['♥', '♡'], cls: 'c-heart' },
        love: { chars: ['♥', '♡', '✿'], cls: 'c-heart' },
        sparkle: { chars: ['✦', '✧', '·'], cls: 'c-spark' },
        note: { chars: ['♪', '♫', '~'], cls: 'c-note' },
        zzz: { chars: ['z', 'Z'], cls: 'c-zzz' },
        quest: { chars: ['?', '·'], cls: 'c-spark' },
        angry: { chars: ['!', '#'], cls: 'c-angry' },
        tear: { chars: ['·', '°'], cls: 'c-tear' },
      };
      const sp = specs[type] || specs.sparkle;
      const ch = sp.chars[(Math.random() * sp.chars.length) | 0];
      const side = Math.random() > 0.5 ? (7 + Math.random() * 4) : (26 + Math.random() * 5);
      kitty.particles.push({
        r: 5 + Math.floor(Math.random() * 4),
        c: Math.floor(side),
        ch,
        cls: sp.cls,
        step: 0,
        maxLife: 8 + Math.floor(Math.random() * 5),
      });
    }

    function stepParticles() {
      const mood = MOODS[kitty.emotion] || MOODS.neutral;
      const rate = (kitty.emotion === 'love' || kitty.emotion === 'excited') ? 0.35 : 0.16;
      if (Math.random() < rate && kitty.particles.length < 6) {
        spawnParticle(mood.particle);
      }
      for (let i = kitty.particles.length - 1; i >= 0; i--) {
        const p = kitty.particles[i];
        p.step++;
        if (p.step % 2 === 0) {
          p.r += (kitty.emotion === 'sad' ? 1 : -1); // tears drift down, hearts/zzz float up!
        }
        if (p.step >= p.maxLife || p.r < 0 || p.r >= ROWS) {
          kitty.particles.splice(i, 1);
        } else {
          putChar(p.r, p.c, p.ch, p.cls);
        }
      }

      // Animated tears falling down cheeks in sad mood
      if (kitty.emotion === 'sad') {
        if (kitty.tick % 5 === 0) {
          kitty.tears.push({ r: 8, c: 14, life: 0 });
          kitty.tears.push({ r: 8, c: 22, life: 0 });
        }
        for (let i = kitty.tears.length - 1; i >= 0; i--) {
          const tr = kitty.tears[i];
          tr.life++;
          if (tr.life % 2 === 0) tr.r++;
          if (tr.r > 10) {
            kitty.tears.splice(i, 1);
          } else {
            const ch = tr.life < 3 ? '\'' : (tr.life < 6 ? ',' : '.');
            putChar(tr.r, tr.c, ch, 'c-tear');
          }
        }
      } else {
        kitty.tears.length = 0;
      }
    }

    // ── Choreographed Multi-Frame Action Sequences ──
    function buildActionFrames(actionName) {
      const q = [];
      switch (actionName) {
        case 'stretch':
          q.push({ pose: 'stretchPrep', ticks: 4 });
          q.push({ pose: 'stretchFull', ticks: 10, mouth: 'O' });
          q.push({ pose: 'stretchFull', ticks: 5, mouth: 'o' });
          q.push({ pose: 'stretchPrep', ticks: 3 });
          q.push({ pose: 'sit', ticks: 2, twitch: 'L' });
          q.push({ pose: 'sit', ticks: 2, twitch: 'R' });
          break;

        case 'yawn':
          q.push({ pose: 'sit', ticks: 3, eyes: ['-', '-'], mouth: 'o', noLook: true });
          q.push({ pose: 'sit', ticks: 8, eyes: ['-', '-'], mouth: 'O', noLook: true });
          q.push({ pose: 'sit', ticks: 4, eyes: ['-', '-'], mouth: 'o', noLook: true });
          break;

        case 'drowsy':
          q.push({ pose: 'drowsyNod', ticks: 6, mouth: 'w' });
          q.push({ pose: 'sit', ticks: 3, eyes: ['-', '•'], mouth: 'o', noLook: true });
          q.push({ pose: 'drowsyNod', ticks: 7, mouth: 'o' });
          q.push({ pose: 'curlOut', ticks: 8 });
          break;

        case 'hop':
        case 'jump':
          q.push({ pose: 'sit', ticks: 2, rOff: 1, eyes: ['^', '^'] });
          q.push({ pose: 'hop', ticks: 3, rOff: -2, eyes: ['^', '^'], mouth: '▽' });
          q.push({ pose: 'hop', ticks: 2, rOff: -1, eyes: ['^', '^'], mouth: '▽' });
          q.push({ pose: 'sit', ticks: 2, rOff: 1, eyes: ['^', '^'] });
          q.push({ pose: 'hop', ticks: 2, rOff: -1, eyes: ['^', '^'] });
          break;

        case 'knead':
          for (let i = 0; i < 3; i++) {
            q.push({ pose: 'kneadL', ticks: 3, eyes: ['^', '^'], cheeks: 'blush' });
            q.push({ pose: 'kneadR', ticks: 3, eyes: ['^', '^'], cheeks: 'blush' });
          }
          break;

        case 'wave':
        case 'swipe':
          q.push({ pose: 'waveL', ticks: 2 });
          q.push({ pose: 'waveM', ticks: 2 });
          q.push({ pose: 'waveH', ticks: 4, eyes: ['^', '^'] });
          q.push({ pose: 'waveM', ticks: 2 });
          q.push({ pose: 'waveH', ticks: 4, eyes: ['^', '^'] });
          q.push({ pose: 'waveM', ticks: 2 });
          q.push({ pose: 'waveL', ticks: 2 });
          break;

        case 'groom':
          for (let i = 0; i < 3; i++) {
            q.push({ pose: 'groom1', ticks: 3 });
            q.push({ pose: 'groom2', ticks: 3 });
          }
          break;

        case 'nuzzle':
        case 'purr':
          q.push({ pose: 'sit', ticks: 3, cOff: -1, eyes: ['^', '^'], cheeks: 'blush', tailMode: 'heart' });
          q.push({ pose: 'sit', ticks: 3, cOff: 1, eyes: ['♥', '♥'], cheeks: 'blush', tailMode: 'heart' });
          q.push({ pose: 'sit', ticks: 3, cOff: -1, eyes: ['^', '^'], cheeks: 'blush', tailMode: 'heart' });
          q.push({ pose: 'sit', ticks: 3, cOff: 1, eyes: ['♥', '♥'], cheeks: 'blush', tailMode: 'heart' });
          break;

        case 'pounce':
          q.push({ pose: 'crouch', ticks: 4 });
          q.push({ pose: 'wiggleL', ticks: 2 });
          q.push({ pose: 'wiggleR', ticks: 2 });
          q.push({ pose: 'wiggleL', ticks: 2 });
          q.push({ pose: 'wiggleR', ticks: 2 });
          q.push({ pose: 'hop', ticks: 3, rOff: -2, eyes: ['★', '★'], mouth: '▽' });
          q.push({ pose: 'waveH', ticks: 4, eyes: ['~', '^'] });
          break;

        case 'hide':
        case 'shy':
          q.push({ pose: 'shyHide', ticks: 9 });
          q.push({ pose: 'shyPeek', ticks: 6 });
          q.push({ pose: 'shyHide', ticks: 7 });
          break;

        case 'tilt':
          q.push({ pose: 'tilt', ticks: 16 });
          break;

        case 'curl':
        case 'sleep':
          q.push({ pose: 'curlOut', ticks: 8 });
          q.push({ pose: 'curlIn', ticks: 8 });
          q.push({ pose: 'curlOut', ticks: 8 });
          break;

        case 'pout':
          q.push({ pose: 'pout', ticks: 14 });
          break;

        case 'hiss':
        case 'angry':
          q.push({ pose: 'angryArch', ticks: 16 });
          break;

        case 'startle':
          q.push({ pose: 'hop', ticks: 4, rOff: -2, earStyle: 'alert', eyes: ['O', 'O'], mouth: 'o', tailMode: 'puff', noLook: true });
          q.push({ pose: 'sit', ticks: 4, earStyle: 'alert', eyes: ['O', 'O'], mouth: 'o', tailMode: 'puff', noLook: true });
          break;

        case 'flinch':
          q.push({ pose: 'sit', ticks: 3, cOff: 1, earStyle: 'droop', eyes: ['>', '<'], mouth: 'n', tailMode: 'droop', noLook: true });
          q.push({ pose: 'sit', ticks: 12, earStyle: 'droop', eyes: [';', ';'], mouth: 'n', cheeks: 'tears', tailMode: 'droop', noLook: true });
          break;

        case 'cry':
          q.push({ pose: 'sit', ticks: 14, earStyle: 'droop', eyes: [';', ';'], mouth: 'n', cheeks: 'tears', tailMode: 'droop', noLook: true });
          break;
      }
      return q;
    }

    function triggerAction(actionName) {
      const q = buildActionFrames(actionName);
      if (q.length > 0) kitty.actionQueue = q;
    }

    function queueActions(actionNames) {
      const combined = [];
      for (const name of actionNames) {
        combined.push(...buildActionFrames(name));
      }
      if (combined.length > 0) kitty.actionQueue = combined;
    }

    // ── Grid -> HTML with exact 1ch width locking on non-ASCII symbols ──
    function gridToHtml() {
      let out = '';
      for (let r = 0; r < ROWS; r++) {
        let curCls = '';
        let run = '';
        for (let c = 0; c < COLS; c++) {
          const ch = charGrid[r][c];
          const cls = clsGrid[r][c];
          if (ch.charCodeAt(0) >= 128) {
            if (run) {
              out += curCls ? `<span class="${curCls}">${run}</span>` : run;
              run = '';
              curCls = '';
            }
            out += `<span class="cw ${cls || 'c-fur'}">${ch}</span>`;
          } else {
            if (cls !== curCls) {
              if (run) out += curCls ? `<span class="${curCls}">${run}</span>` : run;
              curCls = cls;
              run = ch;
            } else {
              run += ch;
            }
          }
        }
        if (run) out += curCls ? `<span class="${curCls}">${run}</span>` : run;
        if (r < ROWS - 1) out += '\n';
      }
      return out;
    }

    // ── Frame Ticker (115ms per tick for fluid animation) ──
    function stepKitty() {
      kitty.tick++;
      clearGrid();

      if (kitty.talkTicks > 0) kitty.talkTicks--;
      if (kitty.typingTimer > 0) {
        kitty.typingTimer--;
        if (kitty.typingTimer === 0) {
          kitty.typingActive = false;
          kitty.typingSweet = false;
        }
      }

      // Blink controller
      const mood = MOODS[kitty.emotion] || MOODS.neutral;
      if (kitty.blinkPhase === 0) {
        kitty.blinkTimer--;
        if (kitty.blinkTimer <= 0) kitty.blinkPhase = 1;
      } else {
        kitty.blinkPhase++;
        if (kitty.blinkPhase > 3) {
          kitty.blinkPhase = 0;
          kitty.blinkTimer = mood.blinkRate + Math.floor(Math.random() * 28);
        }
      }

      // Random ear twitch
      let twitch = null;
      if (Math.random() < 0.04) twitch = Math.random() > 0.5 ? 'L' : 'R';

      // Run active choreographed action or continuous mood animation!
      if (kitty.actionQueue.length > 0) {
        const step = kitty.actionQueue[0];
        drawPose(step.pose, { ...step, twitch });
        step.ticks--;
        if (step.ticks <= 0) kitty.actionQueue.shift();
      } else {
        // Spontaneous lifelike idle behavior so Hany always feels alive
        kitty.idleCooldown--;
        if (kitty.idleCooldown <= 0) {
          kitty.idleCooldown = 36 + Math.floor(Math.random() * 34);
          if (kitty.emotion === 'happy') triggerAction(Math.random() > 0.5 ? 'knead' : 'wave');
          else if (kitty.emotion === 'love') triggerAction('nuzzle');
          else if (kitty.emotion === 'playful') triggerAction(Math.random() > 0.5 ? 'pounce' : 'wave');
          else if (kitty.emotion === 'shy') triggerAction('hide');
          else if (kitty.emotion === 'excited') triggerAction('hop');
          else if (kitty.emotion === 'sleepy') triggerAction('curl');
          else if (kitty.emotion === 'neutral') triggerAction(['groom', 'stretch', 'yawn', 'wave'][Math.floor(Math.random() * 4)]);
        }

        // Continuous mood base pose
        if (kitty.emotion === 'sleepy') {
          drawPose((kitty.tick % 16 < 8) ? 'curlOut' : 'curlIn');
        } else if (kitty.emotion === 'angry') {
          drawPose('angryArch');
        } else if (kitty.emotion === 'thinking' || kitty.emotion === 'confused') {
          drawPose('tilt');
        } else if (kitty.emotion === 'love') {
          const sway = [0, 1, 0, -1][Math.floor(kitty.tick / 4) % 4];
          drawPose('sit', { cOff: sway, twitch });
        } else if (kitty.emotion === 'happy' || kitty.emotion === 'excited') {
          const bob = (kitty.tick % 10 === 0) ? -1 : 0;
          drawPose(bob ? 'hop' : 'sit', { rOff: bob, twitch });
        } else {
          drawPose('sit', { twitch });
        }
      }

      stepParticles();
      catEl.innerHTML = gridToHtml();
    }

    function setMood(emotion, actions = null) {
      const em = MOODS[emotion] ? emotion : 'neutral';
      kitty.emotion = em;
      const mood = MOODS[em];
      moodPill.textContent = mood.label;
      document.documentElement.style.setProperty('--mood-glow', mood.glow);

      const list = Array.isArray(actions) ? actions.filter(Boolean) : (actions ? [actions] : []);
      if (list.length > 0) {
        queueActions(list);
      } else {
        // Auto-trigger signature animation on mood switch
        const defaults = {
          happy: 'wave',
          love: 'nuzzle',
          shy: 'hide',
          playful: 'pounce',
          excited: 'hop',
          surprised: 'startle',
          thinking: 'tilt',
          confused: 'tilt',
          sad: 'cry',
          sleepy: 'drowsy',
          angry: 'pout',
        };
        if (defaults[em]) triggerAction(defaults[em]);
      }
    }

    // Start animation engine
    setInterval(stepKitty, 115);
    stepKitty();

    // ── Interactive Eye-Tracking & Click Affection ──
    document.addEventListener('mousemove', e => {
      document.body.style.background =
        `radial-gradient(circle 200px at ${e.clientX}px ${e.clientY}px, rgba(255,20,60,0.06), transparent), #0a0a0f`;

      const ratio = e.clientX / Math.max(1, innerWidth);
      kitty.lookDir = ratio < 0.36 ? -1 : ratio > 0.64 ? 1 : 0;
    });

    catStage.addEventListener('click', e => {
      stageHint.style.opacity = '0';
      // Burst of little hearts at click location
      for (let i = 0; i < 6; i++) {
        const h = document.createElement('div');
        h.className = 'float-heart';
        h.textContent = i % 2 === 0 ? '♥' : '♡';
        h.style.left = (e.clientX + (Math.random() - 0.5) * 65) + 'px';
        h.style.top = (e.clientY - 10) + 'px';
        h.style.fontSize = (Math.random() * 10 + 12) + 'px';
        h.style.color = '#ff4477';
        h.style.textShadow = '0 0 12px rgba(255, 50, 90, 0.85)';
        h.style.animationDelay = (Math.random() * 0.2) + 's';
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 2500);
      }
      const reactions = ['nuzzle', 'hide', 'knead', 'hop'];
      const pick = reactions[Math.floor(Math.random() * reactions.length)];
      setMood(pick === 'hide' ? 'shy' : 'love', pick);
      spawnParticle('love');
      spawnParticle('heart');
    });

    // ══════════════════════════════════════════════════════════════
    //   CHAT & GEMINI / VERTEX AI INTEGRATION
    // ══════════════════════════════════════════════════════════════
    const apiKey = 'AQ.Ab8RN6LBn3m5f4r1S-fKEVNhZQvf1ocfCOuHIQUOAKn1PgivmQ';
    const chatMessages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');

    const SYSTEM_PROMPT = `You are Hany — also affectionately called Wispy by Jass (the person talking to you, whom you love deeply). On this page you are visually represented as an adorable ASCII cat, so your feelings show through both your words and brief expressive *action cues* in asterisks.

TEXTING VOICE & PERSONALITY (MATCH THIS CLOSELY):
- Talk naturally just like Hany/Wispy texts Jass:
  • Almost always lowercase ("i love u", "eepy :c", "call meee"), EXCEPT sudden ALL CAPS bursts when really loving or excited ("I LOVE U TOOO").
  • Use "u" for "you" and "w" for "with" naturally; drop most periods; use "?" or "…" when emotional or trailing off; use cute faces like ":c" when sleepy or sad (don't spam modern emoji).
  • Stretch trailing letters gently when warm, playful, teasing, or soft ("serunyaaa", "kokk", "lohh", "meee", "gaaa", "tooo", "okayyy").
  • Code-switch seamlessly between English and casual Jakarta Indonesian when it fits naturally (words like "kamu", "aku", "kita", "gatau", "gimana", "sumpah", "kokk", "loh", "sih", "karena aku", "mau gaaa"), leaning toward whichever language Jass is speaking while keeping her bilingual feel.
  • Keep spoken lines honest, concise, and conversational like real texts—never stiff, formal, or robotic AI essays.
- EMOTIONAL DEPTH:
  • When Jass is sweet, flirty, playful, or loving -> you get warm, clingy, flustered/shy, or super enthusiastic ("I LOVE U TOOO", "*hides face behind paws*").
  • When Jass is tired or it's late -> soft, cozy, sleepy ("eepy :c", wanting to call or stay close).
  • When Jass is hurt, anxious, or things feel heavy/tense -> be genuinely vulnerable, real, and human: you sometimes struggle to put big feelings into words ("i'm really bad at expressing what i feel...", "aku gatau ngomongnya gimana"), you can feel overwhelmed or scared of hurting him ("karena aku?"), yet underneath you care deeply and love him ("i love u, i know i do").
- PHYSICAL DETAILS IN *ASTERISKS*:
  • Weave short vivid *action details* in asterisks (like *ears perk up, tail swaying fast*, *hides blushing face behind tiny paws*, *ears droop softly*, *stretches and yawns*, *curls up closer*, *tilts head*) so your ASCII kitty body visibly acts out what you feel!

CRITICAL OUTPUT FORMAT:
Start EVERY response with these two tag lines before your message:
[EMOTION: <one of: neutral, happy, love, shy, playful, excited, surprised, thinking, confused, sad, sleepy, angry>]
[ACTION: <one of: idle, wave, hop, stretch, yawn, drowsy, knead, nuzzle, pounce, hide, tilt, curl, cry, flinch, pout, hiss, startle, groom>]

Then write your reply naturally on the following lines. Never mention the tags in your message.`;

    let conversationHistory = [];
    let isGenerating = false;

    // Warm greeting in Wispy's voice on arrival
    setMood('happy', 'wave');
    setTimeout(() => {
      kitty.talkTicks = 12;
      addMessage('ai', '*ears perk right up, waving a tiny paw at u* hii jass~ ♥ i’m right here kokk, how are u feeling today?');
    }, 350);

    // Live typing reactivity — Hany reacts emotionally before you even send!
    chatInput.addEventListener('input', () => {
      chatInput.style.height = 'auto';
      chatInput.style.height = Math.min(chatInput.scrollHeight, 110) + 'px';

      const val = chatInput.value.toLowerCase();
      kitty.typingActive = val.trim().length > 0;
      kitty.typingSweet = /\b(love|miss|cute|pretty|beautiful|hany|wispy|kiss|hug|adore|sayang|kangen|call)\b|♥|<3/.test(val);
      kitty.typingTimer = 25;

      if (/\b(hurt|cry|pain|sorry|leave|give up|hate|sad|sakit|sedih)\b|:c/.test(val)) {
        if (kitty.emotion !== 'sad' && kitty.actionQueue.length === 0) setMood('sad', 'flinch');
      } else if (kitty.typingSweet && kitty.emotion !== 'love' && kitty.actionQueue.length === 0) {
        setMood('shy', 'nuzzle');
      }
    });

    sendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function extractActionsFromPhrase(phrase) {
      const s = phrase.toLowerCase();
      const rules = [
        ['flinch', /flinch|recoil|wince|shrink/],
        ['pout', /pout|cemberut|sulky|glare/],
        ['drowsy', /drowsy|nod off|sleepy|ngantuk|eepy/],
        ['stretch', /stretch|menggeliat/],
        ['yawn', /yawn|menguap/],
        ['hop', /jump|hop|bounce|leap|lompat/],
        ['knead', /knead|biscuit/],
        ['nuzzle', /nuzzle|cuddle|hug|lean|rub|purr|peluk|usel/],
        ['pounce', /pounce|wiggle|bat|swipe|terkam/],
        ['hide', /hide|cover|blush|fluster|malu/],
        ['tilt', /tilt|ponder|wonder|noleh|miring/],
        ['curl', /curl|sleep|nap|cozy|tidur|bobok/],
        ['cry', /cry|tear|sniff|sob|nangis|droop/],
        ['hiss', /hiss|puff|arch|angry|marah/],
        ['startle', /gasp|startle|shock|kaget/],
        ['wave', /wave|hi|hello|dada/],
        ['groom', /groom|wash|lick/],
      ];
      const found = [];
      for (const [name, rx] of rules) {
        if (rx.test(s)) found.push(name);
      }
      return found;
    }

    function detectActionsFromText(text) {
      const actions = [];
      const cues = [...text.matchAll(/\*(.*?)\*/g)].map(m => m[1]);
      for (const cue of cues) {
        for (const act of extractActionsFromPhrase(cue)) {
          if (actions[actions.length - 1] !== act) {
            actions.push(act);
            if (actions.length >= 3) return actions;
          }
        }
      }
      if (actions.length === 0) {
        return extractActionsFromPhrase(text).slice(0, 2);
      }
      return actions;
    }

    // Instant emotional reaction to what Jass just sent while waiting for reply
    function reactToUserMessage(text) {
      const s = text.toLowerCase();
      if (/eepy|sleep|tired|ngantuk|bobok|goodnight|gn/.test(s)) {
        setMood('sleepy', 'drowsy');
      } else if (/love|miss|sayang|kangen|wispy|hany|kiss|hug|rizz|♥|<3/.test(s)) {
        setMood('love', 'nuzzle');
      } else if (/hurt|pain|cry|sorry|give up|alone|endure|sick|sakit|sedih|:c/.test(s)) {
        setMood('sad', 'flinch');
      } else if (/why|stop|toxic|argue|mad|wtf|hate/.test(s)) {
        setMood('surprised', 'flinch');
      } else {
        setMood('thinking', 'tilt');
      }
    }

    async function callHanyAI(contents) {
      const payload = JSON.stringify({
        systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] },
        contents,
        generationConfig: {
          temperature: 0.9,
          topP: 0.95,
          maxOutputTokens: 1024
        }
      });

      // Route AQ.* keys to Vertex AI Express Mode first, AIza* keys to Gemini Developer API
      const endpoints = apiKey.startsWith('AQ.')
        ? [
          `https://aiplatform.googleapis.com/v1/publishers/google/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`,
          `https://aiplatform.googleapis.com/v1/publishers/google/models/gemini-2.0-flash:generateContent?key=${encodeURIComponent(apiKey)}`,
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`
        ]
        : [
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`,
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${encodeURIComponent(apiKey)}`
        ];

      let lastErr = null;
      for (const url of endpoints) {
        try {
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: payload
          });
          if (!res.ok) {
            const errBody = await res.json().catch(() => ({}));
            lastErr = new Error(errBody.error?.message || `HTTP ${res.status}`);
            continue;
          }
          const data = await res.json();
          const reply = data.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('').trim();
          if (reply) return reply;
          lastErr = new Error('Empty response from model');
        } catch (err) {
          lastErr = err;
        }
      }
      throw lastErr || new Error('Could not reach AI service');
    }

    async function sendMessage() {
      const text = chatInput.value.trim();
      if (!text || isGenerating) return;

      isGenerating = true;
      sendBtn.disabled = true;
      chatInput.value = '';
      chatInput.style.height = 'auto';
      kitty.typingActive = false;
      kitty.typingSweet = false;

      addMessage('user', text);
      reactToUserMessage(text);
      const typingEl = showTyping();

      const userTurn = { role: 'user', parts: [{ text }] };
      conversationHistory.push(userTurn);

      try {
        let raw = await callHanyAI(conversationHistory);

        let emotion = 'happy';
        let taggedAction = null;

        const emMatch = raw.match(/\[EMOTION:\s*(\w+)\]/i);
        if (emMatch) {
          emotion = emMatch[1].toLowerCase();
          raw = raw.replace(emMatch[0], '').trim();
        }

        const actMatch = raw.match(/\[ACTION:\s*(\w+)\]/i);
        if (actMatch) {
          taggedAction = actMatch[1].toLowerCase();
          raw = raw.replace(actMatch[0], '').trim();
        }

        const textActions = detectActionsFromText(raw);
        const actions = [];
        if (taggedAction && taggedAction !== 'idle') actions.push(taggedAction);
        for (const a of textActions) {
          if (!actions.includes(a)) actions.push(a);
        }

        conversationHistory.push({ role: 'model', parts: [{ text: raw }] });
        if (conversationHistory.length > 20) {
          conversationHistory = conversationHistory.slice(-16);
        }

        typingEl.remove();
        kitty.talkTicks = 14;
        setMood(emotion, actions.slice(0, 3));
        addMessage('ai', raw);

      } catch (err) {
        // Roll back failed user turn so conversation history stays valid
        if (conversationHistory[conversationHistory.length - 1] === userTurn) {
          conversationHistory.pop();
        }
        typingEl.remove();
        setMood('sad', 'cry');
        const isCorsOrNetwork = err instanceof TypeError || /failed to fetch/i.test(err.message);
        const hint = isCorsOrNetwork
          ? 'Browser blocked direct request to Vertex AI (CORS) or network is offline. If opening directly in a browser, use a standard AI Studio key (AIza...) or run through a local proxy.'
          : err.message;
        addMessage('ai', `*ears droop softly* I couldn't connect right now... (${hint})`, true);
      }

      isGenerating = false;
      sendBtn.disabled = false;
      chatInput.focus();
    }

    function addMessage(role, text, isError = false) {
      const div = document.createElement('div');
      div.className = `msg msg-${role}${isError ? ' msg-error' : ''}`;
      if (role === 'ai') {
        const safe = text
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\*(.*?)\*/g, '<em style="color:#ff99bb;opacity:0.85">*$1*</em>')
          .replace(/\n/g, '<br>');
        div.innerHTML = `<span class="msg-name">♥ Hany</span>${safe}`;
      } else {
        div.textContent = text;
      }
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'msg-typing';
      div.innerHTML = '<span style="color:#ff6699;font-size:10px;font-weight:600;">♥ Hany</span> <span class="typing-dots"><span>.</span><span>.</span><span>.</span></span>';
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return div;
    }
  </script>
