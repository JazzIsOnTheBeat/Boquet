<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Wispy ♥</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    *::selection {
      background: transparent;
      color: inherit;
    }

    *::-moz-selection {
      background: transparent;
      color: inherit;
    }

    body {
      background: #0a0a0f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: 'Fira Code', 'Courier New', monospace;
      color: #ffaabb;
    }

    #canvas-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      max-width: 900px;
      padding: 16px 12px 36px;
      animation: bouquetEntrance 2.2s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes bouquetEntrance {
      0% {
        opacity: 0;
        transform: scale(0.75) translateY(45px);
      }

      60% {
        opacity: 1;
        transform: scale(1.02) translateY(-6px);
      }

      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* ── High-DPI Pure ASCII Bouquet Stage ── */
    .bouquet-stage {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin-bottom: 4px;
    }

    #bouquet-canvas {
      display: block;
      max-width: 100%;
      cursor: grab;
      touch-action: none;
      outline: none;
    }

    #bouquet-canvas:active,
    #bouquet-canvas.dragging {
      cursor: grabbing;
    }

    /* ── Title, cute ASCII cat & speech ── */
    .glow-line {
      width: min(280px, 75vw);
      height: 1px;
      background: linear-gradient(90deg, transparent, #ff4466, transparent);
      margin: 6px auto 12px;
      opacity: 0;
      animation: fadeIn 1.5s ease 1.6s forwards;
    }

    .title-text {
      color: #ff3355;
      font-size: clamp(10.5px, 2.6vw, 12.5px);
      letter-spacing: 3px;
      text-shadow: 0 0 10px rgba(255, 51, 85, 0.55);
      min-height: 1.4em;
      padding: 0 8px;
      opacity: 0;
      animation: fadeIn 1s ease 1.4s forwards;
    }

    .cat-art {
      margin: 12px auto 6px;
      font-family: 'Fira Code', 'Courier New', monospace;
      font-variant-ligatures: none;
      font-feature-settings: "liga" 0, "calt" 0;
      font-size: 12px;
      line-height: 1.18;
      letter-spacing: 0px;
      color: #ffdbe7;
      text-shadow: 0 0 8px rgba(255, 182, 206, 0.45);
      white-space: pre;
      display: block;
      text-align: left;
      opacity: 0;
      animation: fadeUp 1.2s ease 2.2s forwards;
      cursor: pointer;
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    .cat-art:hover {
      transform: scale(1.08);
      filter: brightness(1.4) drop-shadow(0 0 12px rgba(255, 100, 150, 0.6));
    }

    .cat-shade {
      color: #e394b0;
    }

    .cat-pink {
      color: #ff7096;
      text-shadow: 0 0 8px rgba(255, 112, 150, 0.65);
    }

    .cat-eye {
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.85);
    }

    .cat-heart {
      color: #ff1a3a;
      text-shadow: 0 0 14px rgba(255, 26, 58, 0.95);
      animation: heartPulse 1.5s ease-in-out infinite;
    }

    @keyframes heartPulse {

      0%,
      100% {
        opacity: 0.75;
      }

      50% {
        opacity: 1;
        text-shadow: 0 0 20px rgba(255, 26, 58, 1);
      }
    }

    .speech-area {
      margin-top: 8px;
      padding: 12px 22px;
      border: 1px solid rgba(255, 68, 102, 0.28);
      border-radius: 10px;
      background: rgba(255, 20, 60, 0.05);
      display: block;
      max-width: 460px;
      position: relative;
      opacity: 0;
      animation: fadeUp 1.2s ease 2.6s forwards;
    }

    .speech-area::before {
      content: '';
      position: absolute;
      top: -7px;
      left: 50%;
      transform: translateX(-50%);
      border-left: 7px solid transparent;
      border-right: 7px solid transparent;
      border-bottom: 7px solid rgba(255, 68, 102, 0.28);
    }

    .speech-text {
      color: #ffaabb;
      font-size: 12px;
      line-height: 1.6;
      text-shadow: 0 0 6px rgba(255, 170, 187, 0.3);
      min-height: 1.4em;
    }

    .cursor-blink {
      display: inline;
      animation: blink 0.75s step-end infinite;
      color: #ff4466;
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
      }
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── Falling petals ── */
    .falling-petal {
      position: fixed;
      pointer-events: none;
      z-index: 2;
      animation: fall linear forwards;
      opacity: 0;
    }

    @keyframes fall {
      0% {
        transform: translateY(-30px) rotate(0deg) translateX(0);
        opacity: 0;
      }

      8% {
        opacity: 0.8;
      }

      25% {
        transform: translateY(25vh) rotate(180deg) translateX(28px);
      }

      50% {
        transform: translateY(50vh) rotate(360deg) translateX(-18px);
      }

      75% {
        transform: translateY(75vh) rotate(540deg) translateX(22px);
      }

      92% {
        opacity: 0.5;
      }

      100% {
        transform: translateY(105vh) rotate(720deg) translateX(-10px);
        opacity: 0;
      }
    }

    /* ── Floating hearts on click ── */
    .float-heart {
      position: fixed;
      pointer-events: none;
      z-index: 3;
      animation: floatUp 3.2s ease-out forwards;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.4);
        opacity: 0;
      }

      15% {
        opacity: 1;
        transform: scale(1.1);
      }

      100% {
        transform: translateY(-210px) scale(0.2) rotate(18deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <canvas id="canvas-bg"></canvas>

  <div class="container">
    <div class="bouquet-stage">
      <canvas id="bouquet-canvas" title="Click for hearts ♥ • Drag to rotate"
        aria-label="Interactive 3D ASCII Rose Bouquet"></canvas>
    </div>
    <div class="glow-line"></div>
    <div class="title-text" id="title-line"></div>
    <pre class="cat-art" id="cat-art" title="✨ Click me to meet Hany AI! ✨">     /\_     _/\
    / <span class="cat-pink">^</span> \___/ <span class="cat-pink">^</span> \
   (   <span class="cat-eye" id="cat-eye-l">•</span>     <span class="cat-eye" id="cat-eye-r">•</span>   )   <span class="cat-heart">♥</span>
   (  <span class="cat-pink">===</span> w <span class="cat-pink">===</span>  )  <span class="cat-heart">♥</span>
    \   <span class="cat-shade">`---'</span>   /
    /   ( <span class="cat-heart">♥</span> )   \
   (<span class="cat-shade">___</span>/_____\<span class="cat-shade">___</span>)<span class="cat-shade" id="cat-tail">~-.</span>
   <span class="cat-pink" style="font-size:9px;opacity:0.7">    ✨ click me! ✨</span></pre>
    <div class="speech-area">
      <span class="speech-text" id="speech-text"></span><span class="cursor-blink">█</span>
    </div>
  </div>

  <script>
    // ══════════════════════════════════════════════════════════════
    //   ♥  Upgraded High-Clarity 3D Real-Time ASCII Rose Bouquet  ♥
    // ══════════════════════════════════════════════════════════════

    // ── Prevent blue text-selection highlight on double-click ──
    document.addEventListener('mousedown', e => {
      if (e.detail > 1) e.preventDefault();
    });
    document.addEventListener('selectstart', e => e.preventDefault());

    // ── Full-Screen Twinkling Pink-Tinted Starfield ──
    const bgCanvas = document.getElementById('canvas-bg');
    const bgCtx = bgCanvas.getContext('2d');
    const stars = [];

    function resizeStarfield() {
      bgCanvas.width = window.innerWidth;
      bgCanvas.height = window.innerHeight;
    }
    resizeStarfield();

    for (let i = 0; i < 115; i++) {
      stars.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        r: Math.random() * 1.35 + 0.3,
        a: Math.random(),
        spd: Math.random() * 0.014 + 0.004,
        d: Math.random() > 0.5 ? 1 : -1
      });
    }

    function drawStars() {
      bgCtx.clearRect(0, 0, bgCanvas.width, bgCanvas.height);
      for (let i = 0; i < stars.length; i++) {
        const s = stars[i];
        s.a += s.spd * s.d;
        if (s.a >= 1) { s.a = 1; s.d = -1; }
        if (s.a <= 0.08) { s.a = 0.08; s.d = 1; }
        bgCtx.beginPath();
        bgCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        bgCtx.fillStyle = `rgba(255,160,190,${(s.a * 0.52).toFixed(3)})`;
        bgCtx.fill();
      }
      requestAnimationFrame(drawStars);
    }

    // ── Cute ASCII Cat Idle Animations (Blinking & Tail Swish) ──
    const eyeL = document.getElementById('cat-eye-l');
    const eyeR = document.getElementById('cat-eye-r');
    const tailEl = document.getElementById('cat-tail');

    setInterval(() => {
      eyeL.textContent = '^';
      eyeR.textContent = '^';
      setTimeout(() => {
        eyeL.textContent = '•';
        eyeR.textContent = '•';
      }, 220);
    }, 3800);

    const tailFrames = ['~-.', '.-~', '~-~', '.-~'];
    let tailIdx = 0;
    setInterval(() => {
      tailIdx = (tailIdx + 1) % tailFrames.length;
      tailEl.textContent = tailFrames[tailIdx];
    }, 550);

    // ── Cat click → navigate to Hany AI ──
    document.getElementById('cat-art').addEventListener('click', e => {
      e.stopPropagation();
      window.location.href = 'hany.html';
    });

    // ══════════════════════════════════════════════════════════════
    //   3D PARAMETRIC BOUQUET MESH BUILDER (TYPED-ARRAY ENGINE)
    // ══════════════════════════════════════════════════════════════

    // Temporary builders before packing into fast TypedArrays
    const rawPx = [], rawPy = [], rawPz = [];
    const rawNx = [], rawNy = [], rawNz = [];
    const rawOx = [], rawOy = [], rawOz = []; // Local offset from bloom center (for breathing petals)
    const rawAo = [], rawRim = [];
    const rawMat = [], rawBloom = [], rawGlyph = [];
    const rawTailV = [], rawTailSide = [];

    // Material IDs:
    // 0 = Rose petal, 1 = Leaf/Calyx/Stem, 2 = Pleated wrapping paper,
    // 3 = Satin ribbon & bow, 4 = Golden thorn, 5 = Baby's breath floret, 6 = Fine baby's breath stem
    const SPECIAL_GLYPHS = ['', '*', '+', '°', '·'];

    function pushPoint(
      x, y, z,
      nx, ny, nz,
      mat, ao, rim = 0,
      bloomId = -1,
      ox = 0, oy = 0, oz = 0,
      glyphId = 0,
      tailV = 0, tailSide = 0
    ) {
      const len = Math.hypot(nx, ny, nz) || 1;
      rawPx.push(x); rawPy.push(y); rawPz.push(z);
      rawNx.push(nx / len); rawNy.push(ny / len); rawNz.push(nz / len);
      rawOx.push(ox); rawOy.push(oy); rawOz.push(oz);
      rawAo.push(ao); rawRim.push(rim);
      rawMat.push(mat);
      rawBloom.push(bloomId);
      rawGlyph.push(glyphId);
      rawTailV.push(tailV);
      rawTailSide.push(tailSide);
    }

    function rotVec(x, y, z, rx, ry, rz) {
      // Rotate around X, then Z, then Y
      const cx = Math.cos(rx), sx = Math.sin(rx);
      const y1 = y * cx - z * sx;
      const z1 = y * sx + z * cx;
      const x1 = x;

      const cz = Math.cos(rz), sz = Math.sin(rz);
      const x2 = x1 * cz - y1 * sz;
      const y2 = x1 * sz + y1 * cz;
      const z2 = z1;

      const cy = Math.cos(ry), sy = Math.sin(ry);
      const x3 = x2 * cy + z2 * sy;
      const z3 = -x2 * sy + z2 * cy;
      return [x3, y2, z3];
    }

    // ── 1. High-Clarity 3D Sculpted Fibonacci Rose with Rim-Edge Highlighting ──
    function addRose(cx, cy, cz, rx, ry, rz, scale, isBud, bloomId) {
      const numPetals = isBud ? 13 : 23;
      const uSteps = isBud ? 10 : 12;
      const vSteps = isBud ? 9 : 11;
      const goldenAngle = 2.3999632;

      function petalPos(t, thetaK, u, v) {
        const halfSpan = (isBud ? 1.04 : 1.02) - 0.28 * t;
        const theta = thetaK + u * halfSpan;

        // Tighter inner spiral bud transitioning smoothly into wide cupped outer petals
        const r0 = (isBud ? 0.025 : 0.032) + (isBud ? 0.085 : 0.185) * t;
        const r1 = (isBud ? 0.145 : 0.215) + (isBud ? 0.30 : 0.72) * Math.pow(t, 0.86);

        const cup = Math.pow(Math.sin(v * Math.PI * 0.5), isBud ? 0.94 : 0.72);
        const widthProfile = 1 - 0.13 * u * u;
        let r = r0 + (r1 - r0) * cup * widthProfile;

        // Graceful recurved outer lip along top 38% of petal
        const cv = Math.max(0, (v - 0.62) / 0.38);
        const curlAmt = isBud ? (0.02 + 0.055 * t) : (0.055 + 0.29 * Math.pow(t, 1.05));
        const rimCurl = cv * cv * curlAmt * (1 - 0.24 * u * u);
        r += rimCurl;

        // High-centered classic rose profile with delicate wave along upper rim
        const y0 = -0.15 - 0.15 * t;
        const heightSpan = (isBud ? 0.80 : 0.75) + (isBud ? 0.10 : 0.18) * (1 - 0.42 * t);
        const rimArch = 1 - 0.35 * u * u + 0.045 * Math.cos(3.0 * u);
        const y = y0 + heightSpan * Math.pow(v, 0.82) * rimArch - rimCurl * 0.60;

        return [r * Math.sin(theta), y, r * Math.cos(theta)];
      }

      for (let k = 0; k < numPetals; k++) {
        const t = k / (numPetals - 1);
        const thetaK = k * goldenAngle + bloomId * 0.95;

        for (let iu = 0; iu <= uSteps; iu++) {
          const u = (iu / uSteps) * 2 - 1;
          for (let iv = 0; iv <= vSteps; iv++) {
            const v = iv / vSteps;

            const [px, py, pz] = petalPos(t, thetaK, u, v);
            const eps = 0.025;
            const [ux, uy, uz] = petalPos(t, thetaK, Math.min(1, u + eps), v);
            const [vx, vy, vz] = petalPos(t, thetaK, u, Math.min(1, v + eps));

            const dux = ux - px, duy = uy - py, duz = uz - pz;
            const dvx = vx - px, dvy = vy - py, dvz = vz - pz;

            let nx = duy * dvz - duz * dvy;
            let ny = duz * dvx - dux * dvz;
            let nz = dux * dvy - duy * dvx;

            // Ensure normals consistently face outward from rose axis
            if (nx * px + nz * pz < 0) {
              nx = -nx; ny = -ny; nz = -nz;
            }

            // Deep velvety AO in petal crevices & center, bright on upper outer faces
            const radialDepth = 0.26 + 0.36 * Math.pow(t, 0.85);
            const verticalLift = 0.44 * Math.pow(v, 1.35);
            const ao = Math.min(1.05, radialDepth + verticalLift);

            // Crisp petal-edge rim highlight along the curled lip & side silhouette
            let rim = 0;
            if (v > 0.74) {
              const lipT = (v - 0.74) / 0.26;
              rim = Math.pow(lipT, 1.28) * (0.58 + 0.42 * (1 - 0.35 * u * u));
              // Slight modulation so innermost rosette swirl stays crisp and distinct
              rim *= (0.76 + 0.28 * t);
            }
            if (Math.abs(u) > 0.86 && v > 0.42) {
              const sideRim = ((Math.abs(u) - 0.86) / 0.14) * v * 0.42;
              if (sideRim > rim) rim = sideRim;
            }

            const [wx, wy, wz] = rotVec(px * scale, py * scale, pz * scale, rx, ry, rz);
            const [wnx, wny, wnz] = rotVec(nx, ny, nz, rx, ry, rz);

            pushPoint(
              cx + wx, cy + wy, cz + wz,
              wnx, wny, wnz,
              0, ao, rim, bloomId,
              wx, wy, wz
            );
          }
        }
      }

      // Sculpted Green Sepals / Calyx cupping the base of the rose
      const numSepals = 5;
      for (let s = 0; s < numSepals; s++) {
        const ang = (s / numSepals) * Math.PI * 2 + 0.35 + bloomId * 0.4;
        for (let sv = 0; sv <= 8; sv++) {
          const f = sv / 8;
          const wMax = (1 - f * 0.92) * 0.16 + 0.015;
          for (let su = -2; su <= 2; su++) {
            const u = su / 2;
            const sr = 0.13 + f * (isBud ? 0.34 : 0.56);
            const sy = -0.22 - f * 0.14 + Math.sin(f * Math.PI) * 0.08;
            const sideAng = ang + (u * wMax) / sr;
            const px = sr * Math.sin(sideAng);
            const pz = sr * Math.cos(sideAng);

            const [wx, wy, wz] = rotVec(px * scale, sy * scale, pz * scale, rx, ry, rz);
            const [wnx, wny, wnz] = rotVec(Math.sin(ang), -0.45, Math.cos(ang), rx, ry, rz);
            const veinRim = (su === 0 ? 0.35 : 0.05) + f * 0.2;
            pushPoint(
              cx + wx, cy + wy, cz + wz,
              wnx, wny, wnz,
              1, 0.62 + 0.35 * f, veinRim, bloomId,
              wx, wy, wz
            );
          }
        }
      }
    }

    // ── 2. Serrated Rose Leaves with Crisp Central Vein Highlights ──
    function addLeaf(bx, by, bz, dirAngle, pitch, roll, length, width, leafId) {
      const uSteps = 8;
      const vSteps = 13;

      for (let iv = 0; iv <= vSteps; iv++) {
        const v = iv / vSteps;
        const serration = 1 + 0.11 * Math.sin(v * Math.PI * 8);
        const halfW = width * Math.sin(Math.pow(v, 0.72) * Math.PI) * serration;

        for (let iu = 0; iu <= uSteps; iu++) {
          const u = (iu / uSteps) * 2 - 1;
          const lx = u * halfW;
          const lz = v * length;
          // Gentle V-fold along midrib plus natural downward arch
          const ly = Math.sin(v * Math.PI) * 0.18 - v * v * 0.28 + Math.abs(u) * 0.065;

          const nx = u * 0.42;
          const ny = 0.90 - v * 0.36;
          const nz = 0.22;

          const [wx, wy, wz] = rotVec(lx, ly, lz, pitch, dirAngle, roll);
          const [wnx, wny, wnz] = rotVec(nx, ny, nz, pitch, dirAngle, roll);

          const isMidrib = Math.abs(u) < 0.16;
          const isEdge = Math.abs(u) > 0.85;
          const ao = 0.56 + 0.36 * v + (isEdge ? 0.12 : 0);
          const veinRim = isMidrib ? (0.48 * (1 - 0.3 * v)) : (isEdge ? 0.22 : 0);

          pushPoint(
            bx + wx, by + wy, bz + wz,
            wnx, wny, wnz,
            1, ao, veinRim, leafId,
            wx, wy, wz
          );
        }
      }
    }

    // ── 3. Delicate Baby's Breath (Gypsophila) Sprigs ──
    function addBabysBreath(bx, by, bz, tx, ty, tz, sprigId) {
      // Fine stem from bouquet heart to sprig tip
      const stemSteps = 11;
      for (let i = 0; i <= stemSteps; i++) {
        const t = i / stemSteps;
        const arch = Math.sin(t * Math.PI) * 0.08;
        const sx = bx + (tx - bx) * t;
        const sy = by + (ty - by) * t + arch;
        const sz = bz + (tz - bz) * t;
        pushPoint(sx, sy, sz, 0, 1, 0.3, 6, 0.62, 0.1, sprigId, sx - bx, sy - by, sz - bz);
      }

      // Airy cluster of 6–8 tiny cream/ivory florets branching from the tip
      const offsets = [
        [0.00, 0.06, 0.02, 1],
        [-0.14, 0.12, 0.06, 2],
        [0.15, 0.10, -0.05, 1],
        [-0.08, -0.06, 0.13, 3],
        [0.10, -0.04, 0.12, 2],
        [0.02, 0.19, -0.08, 1],
        [-0.17, 0.00, -0.08, 4],
        [0.16, 0.02, 0.09, 3]
      ];

      for (let f = 0; f < offsets.length; f++) {
        const [ox, oy, oz, glyphId] = offsets[f];
        // Tiny twig connecting to floret
        const mx = tx + ox * 0.55;
        const my = ty + oy * 0.55;
        const mz = tz + oz * 0.55;
        pushPoint(mx, my, mz, 0, 1, 0.4, 6, 0.65, 0.1, sprigId, ox * 0.55, oy * 0.55, oz * 0.55);

        // Glowing floret point (plus tiny halo core for crisp visibility)
        const fx = tx + ox;
        const fy = ty + oy;
        const fz = tz + oz;
        const lumBoost = (f % 2 === 0) ? 0.98 : 0.80;
        pushPoint(
          fx, fy, fz,
          0.1, 0.8, 0.6,
          5, lumBoost, 0.65, sprigId,
          ox, oy, oz, glyphId
        );
      }
    }

    // ── 4. Curved Stems + Subtle Golden Thorns ──
    function addStem(topX, topY, topZ, botX, botY, botZ, radius, hasThorns) {
      const waistY = -1.45;
      const waistX = topX * 0.13;
      const waistZ = topZ * 0.13;
      const steps = 36;
      const radialSteps = 8;

      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        let sx, sy, sz;
        if (t < 0.66) {
          const u = t / 0.66;
          const ease = u * u * (3 - 2 * u);
          sx = topX + (waistX - topX) * ease;
          sy = topY + (waistY - topY) * u;
          sz = topZ + (waistZ - topZ) * ease;
        } else {
          const u = (t - 0.66) / 0.34;
          sx = waistX + (botX - waistX) * u;
          sy = waistY + (botY - waistY) * u;
          sz = waistZ + (botZ - waistZ) * u;
        }

        for (let j = 0; j < radialSteps; j++) {
          const ang = (j / radialSteps) * Math.PI * 2;
          const nx = Math.cos(ang);
          const nz = Math.sin(ang);
          pushPoint(sx + nx * radius, sy, sz + nz * radius, nx, 0.1, nz, 1, 0.68, 0.08, -1);
        }

        // Subtle golden thorns peeking near visible stem segments
        if (hasThorns && (i === 11 || i === 29 || i === 33)) {
          const tAng = i * 2.25;
          for (let k = 1; k <= 3; k++) {
            const tr = radius + k * 0.032;
            pushPoint(
              sx + Math.cos(tAng) * tr,
              sy + k * 0.014,
              sz + Math.sin(tAng) * tr,
              Math.cos(tAng), 0.4, Math.sin(tAng),
              4, 0.95, 0.4, -1
            );
          }
        }
      }
    }

    // ── 5. Pleated White/Silver Florist Wrapping Paper Fan Collar ──
    function addWrappingPaper() {
      const waistY = -1.45;
      const waistR = 0.38;
      const thetaSteps = 84;
      const vSteps = 24;

      for (let it = 0; it < thetaSteps; it++) {
        const theta = (it / thetaSteps) * Math.PI * 2;
        // High pleated fan in the back (theta = PI), low sculpted V-collar in the front (theta = 0)
        const backFactor = 0.5 - 0.5 * Math.cos(theta);
        const topY = -0.46 + 2.48 * Math.pow(backFactor, 0.84);
        const topR = 1.48 + 0.78 * backFactor;
        const pleatWave = Math.sin(theta * 16);
        const pleat = 0.068 * pleatWave;

        for (let iv = 0; iv <= vSteps; iv++) {
          const v = iv / vSteps;
          const y = waistY + (topY - waistY) * v;
          const r = waistR + (topR - waistR) * Math.pow(v, 0.90) + pleat * v;

          const px = r * Math.sin(theta);
          const pz = r * Math.cos(theta);

          const pleatNorm = 0.44 * Math.cos(theta * 16);
          const nx = Math.sin(theta) + pleatNorm * Math.cos(theta);
          const nz = Math.cos(theta) - pleatNorm * Math.sin(theta);
          const ny = -0.22;

          // Strong crease contrast between deep folds and bright outer ridges + crisp top rim
          const isTopEdge = v > 0.92;
          const ao = 0.46 + 0.34 * v + 0.24 * pleatWave;
          const rim = (isTopEdge ? 0.48 : 0) + Math.max(0, pleatWave) * 0.22;
          pushPoint(px, y, pz, nx, ny, nz, 2, ao, rim, -1);
        }
      }

      // Flared pleated lower skirt below the ribbon waist
      const skirtSteps = 13;
      for (let it = 0; it < 64; it++) {
        const theta = (it / 64) * Math.PI * 2;
        const pleatWave = Math.sin(theta * 14);
        const pleat = 0.048 * pleatWave;
        for (let iv = 0; iv <= skirtSteps; iv++) {
          const v = iv / skirtSteps;
          const y = waistY - v * 0.90;
          const r = waistR + v * 0.62 + pleat * v;
          const px = r * Math.sin(theta);
          const pz = r * Math.cos(theta);
          const ao = 0.48 + 0.24 * (1 - v) + 0.20 * pleatWave;
          const rim = (v > 0.90 ? 0.32 : 0) + Math.max(0, pleatWave) * 0.16;
          pushPoint(px, y, pz, Math.sin(theta), 0.14, Math.cos(theta), 2, ao, rim, -1);
        }
      }
    }

          pushPoint(kx, ky, kz, kx * 2.2, ky - waistY, 1.0, 3, 0.95, sheen, -1);

            );
          }
        }
      }

    let mouseX = window.innerWidth * 0.5;
    let mouseY = window.innerHeight * 0.5;
    let tiltX = 0, tiltZ = 0;
    let velX = 0, velZ = 0;

    // User 3D drag state
    let isDragging = false;
    let dragMoved = false;
    let suppressNextDocClick = false;
    let lastPtrX = 0, lastPtrY = 0;
    let startPtrX = 0, startPtrY = 0;
    let userYaw = 0, userPitch = 0;
    let yawVel = 0, pitchVel = 0;

    // Springy click bounce & upward shimmer wave state
    let bouncePos = 0, bounceVel = 0;
    let bloomPulse = 0;
    let shimmerProgress = -1; // -1 = inactive, 0..1 = traveling upward across bouquet

    document.addEventListener('mousemove', e => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      document.body.style.background =
        `radial-gradient(circle 250px at ${e.clientX}px ${e.clientY}px, rgba(255,25,68,0.075), transparent), #0a0a0f`;
    });

    bouquetCanvas.addEventListener('pointerdown', e => {
      isDragging = true;
      dragMoved = false;
      startPtrX = lastPtrX = e.clientX;
      startPtrY = lastPtrY = e.clientY;
      yawVel = 0;
      pitchVel = 0;
      bouquetCanvas.classList.add('dragging');
      try { bouquetCanvas.setPointerCapture(e.pointerId); } catch (_) { }
    });

    bouquetCanvas.addEventListener('pointermove', e => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      if (!isDragging) return;
      const dx = e.clientX - lastPtrX;
      const dy = e.clientY - lastPtrY;
      lastPtrX = e.clientX;
      lastPtrY = e.clientY;

      if (Math.hypot(e.clientX - startPtrX, e.clientY - startPtrY) > 6) {
        dragMoved = true;
      }

      const dYaw = dx * 0.009;
      const dPitch = dy * 0.007;
      userYaw += dYaw;
      userPitch = Math.max(-0.72, Math.min(0.72, userPitch + dPitch));
      yawVel = dYaw;
      pitchVel = dPitch;
    });

    function endDrag(e) {
      if (!isDragging) return;
      isDragging = false;
      bouquetCanvas.classList.remove('dragging');
      try { bouquetCanvas.releasePointerCapture(e.pointerId); } catch (_) { }

      if (dragMoved) {
        // Prevent drag release from triggering a stray floating-hearts burst
        suppressNextDocClick = true;
        setTimeout(() => { suppressNextDocClick = false; }, 120);
      } else {
        // Joyful springy bounce + upward rose shimmer wave + 3D sparkle burst!
        bounceVel = 0.28;
        bloomPulse = 1.0;
        shimmerProgress = 0.0;
        spawnBouquetBurst();
      }
    }

    bouquetCanvas.addEventListener('pointerup', endDrag);
    bouquetCanvas.addEventListener('pointercancel', endDrag);

    // Primary directional light (upper-front-left for crisp 3D depth)
    const lx = -0.38, ly = 0.72, lz = 0.58;
    const lLen = Math.hypot(lx, ly, lz);
    const Lx = lx / lLen, Ly = ly / lLen, Lz = lz / lLen;

    // Soft warm fill light from lower-right to keep shadowed folds subtly sculpted
    const fx = 0.52, fy = 0.18, fz = 0.65;
    const fLen = Math.hypot(fx, fy, fz);
    const Fx = fx / fLen, Fy = fy / fLen, Fz = fz / fLen;

    // Per-bloom animated transform scratch arrays (up to 24 bloom/leaf groups)
    const bloomBreath = new Float32Array(24);
    const bloomBob = new Float32Array(24);
    const bloomNodSin = new Float32Array(24);
    const bloomNodCos = new Float32Array(24);

    let lastTimeMs = 0;

    function renderFrame(nowMs) {
      const dt = lastTimeMs ? Math.min(0.05, (nowMs - lastTimeMs) * 0.001) : 0.016;
      lastTimeMs = nowMs;
      const t = nowMs * 0.001;

      // 1. Mouse parallax spring physics
      const targetTiltZ = -((mouseX - window.innerWidth * 0.5) / (window.innerWidth * 0.5)) * 0.15;
      const targetTiltX = ((mouseY - window.innerHeight * 0.5) / (window.innerHeight * 0.5)) * 0.11;
      velZ = (velZ + (targetTiltZ - tiltZ) * 0.035) * 0.87;
      velX = (velX + (targetTiltX - tiltX) * 0.035) * 0.87;
      tiltZ += velZ;
      tiltX += velX;

      // 2. Smooth drag inertia & gentle return toward front showcase sway
      if (!isDragging) {
        userYaw += yawVel;
        userPitch = Math.max(-0.72, Math.min(0.72, userPitch + pitchVel));
        yawVel *= 0.93;
        pitchVel *= 0.90;

        // Wrap userYaw to [-PI, PI] so it eases back via the shortest angular path
        if (Math.abs(yawVel) < 0.018) {
          userYaw = ((userYaw + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
          userYaw *= Math.pow(0.982, dt * 60);
          userPitch *= Math.pow(0.958, dt * 60);
        }
      }

      // 3. Springy bounce & upward shimmer wave from click
      const bounceAccel = -38.0 * bouncePos - 5.4 * bounceVel;
      bounceVel += bounceAccel * dt;
      bouncePos += bounceVel * dt;
      bloomPulse *= Math.pow(0.93, dt * 60);

      let shimmerY = -99;
      if (shimmerProgress >= 0) {
        shimmerProgress += dt * 1.18;
        shimmerY = -2.4 + shimmerProgress * 5.0;
        if (shimmerProgress > 1.2) shimmerProgress = -1;
      }

      // 4. Layered Organic Wind, Swelling Gusts & Gentle Showcase Sway (±24°)
      const gustWave = Math.max(0, Math.sin(t * 0.44) * Math.sin(t * 0.21 + 1.2));
      const gust = gustWave * gustWave; // Periodic graceful wind swells
      const breezeZ = Math.sin(t * 1.15) * 0.075 + Math.sin(t * 2.35) * 0.024 + gust * 0.16 + tiltZ;
      const breezeX = Math.cos(t * 0.92) * 0.052 + gust * 0.065 + tiltX;

      // Showcase sway gently turns ±24° left/right so the roses & bow stay prominently showcased
      const showcaseYaw = Math.sin(t * 0.56) * 0.40 + Math.sin(t * 0.26) * 0.055;
      const totalYaw = showcaseYaw + userYaw;
      const totalPitch = 0.14 + breezeX * 0.36 + userPitch + bouncePos * 0.18;

      const cosY = Math.cos(totalYaw), sinY = Math.sin(totalYaw);
      const cosX = Math.cos(totalPitch), sinX = Math.sin(totalPitch);

      // Precompute per-bloom living breathing, bobbing & nodding
      for (let b = 0; b < 24; b++) {
        const phase = b * 0.92;
        bloomBreath[b] = 0.044 * Math.sin(t * 1.25 + phase) + bloomPulse * 0.085;
        bloomBob[b] = Math.sin(t * 1.75 + phase) * 0.026 + gust * Math.sin(t * 3.1 + phase) * 0.018;
        const nod = Math.sin(t * 1.35 + phase) * 0.032 + gust * 0.045;
        bloomNodSin[b] = Math.sin(nod);
        bloomNodCos[b] = Math.cos(nod);
      }

      // Clear Z-buffer & character grids
      zBuf.fill(-1e9);
      charBuf.fill(32);
      specialBuf.fill(0);
      colorBuf.fill(0);

      const camDist = 6.65;
      const fovY = 65.5;
      const fovX = fovY * charAspect;
      const halfCols = COLS * 0.5;
      const halfRows = ROWS * 0.5;
      const yOffset = 0.28 + bouncePos * 0.22;

      // 5. Project & Shade 3D Bouquet Points
      for (let i = 0; i < NUM_POINTS; i++) {
        let x = P_X[i];
        let y = P_Y[i];
        let z = P_Z[i];
        let nx = N_X[i];
        let ny = N_Y[i];
        let nz = N_Z[i];

        const bloomId = P_BLOOM[i];
        if (bloomId >= 0) {
          // Organic petal breathing (expands gently from bloom center) + subtle nod & bob
          const ox = O_X[i], oy = O_Y[i], oz = O_Z[i];
          const br = bloomBreath[bloomId];
          x += ox * br;
          y += oy * (br * 0.65) + bloomBob[bloomId];
          z += oz * br;

          // Subtle bloom nod in wind
          const ns = bloomNodSin[bloomId], nc = bloomNodCos[bloomId];
          const nodY = oy * nc - oz * ns;
          const nodZ = oy * ns + oz * nc;
          y += (nodY - oy);
          z += (nodZ - oz);
        }

        // Flowing ribbon tail flutter in wind gusts
        const tailV = P_TAILV[i];
        if (tailV > 0) {
          const flutterAmp = tailV * tailV * (0.095 + gust * 0.17);
          const wavePhase = t * 4.4 - tailV * 4.8 + P_TAILS[i] * 0.9;
          x += Math.sin(wavePhase) * flutterAmp + breezeZ * tailV * 0.36;
          z += Math.cos(wavePhase * 0.85) * flutterAmp * 0.85 + Math.abs(breezeX) * tailV * 0.2;
        }

        // Cantilever wind bend anchored at the cinched waist (y = -1.45), with sweeping phase lag
        const lever = Math.max(-0.45, y + 1.45);
        const bend = lever * Math.abs(lever) * 0.068;
        const sweepLag = Math.sin(t * 2.1 - x * 0.7) * (0.015 + gust * 0.042);
        x += (breezeZ + sweepLag) * bend;
        z += breezeX * bend;

        const wy = y + yOffset;

        // Camera yaw + pitch rotation
        const x1 = x * cosY + z * sinY;
        const z1 = -x * sinY + z * cosY;
        const y2 = wy * cosX - z1 * sinX;
        const z2 = wy * sinX + z1 * cosX;

        const depth = camDist - z2;
        if (depth <= 0.5) continue;

        const invZ = 1 / depth;
        const sx = (halfCols + x1 * fovX * invZ) | 0;
        const sy = (halfRows - y2 * fovY * invZ) | 0;
        if (sx < 0 || sx >= COLS || sy < 0 || sy >= ROWS) continue;

        const idx = sy * COLS + sx;
        if (z2 > zBuf[idx]) {
          zBuf[idx] = z2;

          // Rotate normal into view space
          const nx1 = nx * cosY + nz * sinY;
          const nz1 = -nx * sinY + nz * cosY;
          const ny2 = ny * cosX - nz1 * sinX;
          const nz2 = ny * sinX + nz1 * cosX;

          const mat = P_MAT[i];
          const ao = P_AO[i];
          const rim = P_RIM[i];

          // Shimmer wave boost on click
          let shimmerBoost = 0;
          if (shimmerProgress >= 0) {
            const distS = Math.abs(y - shimmerY);
            if (distS < 0.72) {
              const s = 1 - distS / 0.72;
              shimmerBoost = s * s;
            }
          }

          if (mat === 5) {
            // Baby's breath glowing ivory floret
            const twinkle = 0.14 * Math.sin(t * 3.2 + i * 0.7);
            const lum = Math.min(1, ao + twinkle + shimmerBoost * 0.35);
            specialBuf[idx] = P_GLYPH[i];
            colorBuf[idx] = lum > 0.90 ? 23 : (lum > 0.74 ? 22 : 21);
          } else {
            const ndl = nx1 * Lx + ny2 * Ly + nz2 * Lz;
            const diffMain = Math.max(0, ndl);
            const diffBack = Math.max(0, -ndl) * 0.22; // Soft translucent petal velvet wrap
            const diffFill = Math.max(0, nx1 * Fx + ny2 * Fy + nz2 * Fz) * 0.24;
            const fresnel = Math.pow(1 - Math.abs(nz2), 2.1) * 0.22;

            let lum;
            if (mat === 0) {
              // High-contrast rose shader: deep velvet crevices + bright curled petal rims
              lum = (0.14 + 0.62 * diffMain + diffBack + diffFill * 0.55 + fresnel) * ao;
              lum += rim * (0.44 + 0.20 * diffMain);
              lum += shimmerBoost * 0.44;
              lum = Math.max(0.05, Math.min(1.0, lum));
              colorBuf[idx] = 1 + Math.min(6, (lum * 6.85) | 0);
            } else if (mat === 1 || mat === 6) {
              // Crisp emerald-to-mint leaves, sepals & stems
              lum = (0.20 + 0.62 * diffMain + diffFill + fresnel * 0.6) * ao + rim * 0.34 + shimmerBoost * 0.28;
              lum = Math.max(0.10, Math.min(1.0, lum));
              colorBuf[idx] = 8 + Math.min(3, (lum * 3.85) | 0);
            } else if (mat === 2) {
              // Pleated white/silver wrapping paper
              lum = (0.20 + 0.58 * diffMain + diffFill + fresnel * 0.4) * ao + rim * 0.30 + shimmerBoost * 0.22;
              lum = Math.max(0.10, Math.min(1.0, lum));
              colorBuf[idx] = 12 + Math.min(3, (lum * 3.85) | 0);
            } else if (mat === 3) {
              // Glossy satin crimson-pink ribbon & 3D bow
              const spec = Math.pow(Math.max(0, nz2 * 0.65 + ny2 * 0.55 - nx1 * 0.25), 5) * 0.42;
              lum = (0.22 + 0.58 * diffMain + diffFill + spec) * ao + rim * 0.28 + shimmerBoost * 0.35;
              lum = Math.max(0.12, Math.min(1.0, lum));
              colorBuf[idx] = 16 + Math.min(3, (lum * 3.85) | 0);
            } else {
              // Golden thorn
              lum = Math.min(1.0, 0.72 + 0.28 * diffMain);
              colorBuf[idx] = 20;
            }

            const rampIdx = Math.min(RAMP.length - 1, Math.max(1, (lum * (RAMP.length - 1) + 0.4) | 0));
            charBuf[idx] = RAMP_CODES[rampIdx];
            specialBuf[idx] = 0;
          }
        }
      }

      // 6. Project 3D Z-Buffered Orbiting Sparkles & Fireflies (passing in front & behind!)
      for (let i = 0; i < orbitingAccents.length; i++) {
        const a = orbitingAccents[i];
        const ang = t * a.spd + a.phase;
        const ax = Math.cos(ang) * a.rad;
        const az = Math.sin(ang) * a.rad * 0.88;
        const ay = a.yBase + Math.sin(t * 1.9 + a.phase * 1.7) * a.ampY + yOffset;

        // Twinkle visibility
        if (Math.sin(t * 3.4 + a.phase * 2.3) < -0.58) continue;

        const x1 = ax * cosY + az * sinY;
        const z1 = -ax * sinY + az * cosY;
        const y2 = ay * cosX - z1 * sinX;
        const z2 = ay * sinX + z1 * cosX;
        const depth = camDist - z2;
        if (depth <= 0.5) continue;

        const sx = (halfCols + (x1 * fovX) / depth) | 0;
        const sy = (halfRows - (y2 * fovY) / depth) | 0;
        if (sx >= 0 && sx < COLS && sy >= 0 && sy < ROWS) {
          const idx = sy * COLS + sx;
          if (z2 > zBuf[idx]) {
            zBuf[idx] = z2;
            specialBuf[idx] = a.glyph;
            colorBuf[idx] = a.col;
          }
        }
      }

      // 7. Update & Project Click-Burst 3D Sparkles
      for (let i = burstSparkles.length - 1; i >= 0; i--) {
        const p = burstSparkles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.z += p.vz * dt;
        p.vy -= 1.2 * dt; // Gentle gravity arc
        p.life -= dt * 0.92;
        if (p.life <= 0) {
          burstSparkles.splice(i, 1);
          continue;
        }
        const x1 = p.x * cosY + p.z * sinY;
        const z1 = -p.x * sinY + p.z * cosY;
        const ay = p.y + yOffset;
        const y2 = ay * cosX - z1 * sinX;
        const z2 = ay * sinX + z1 * cosX;
        const depth = camDist - z2;
        if (depth <= 0.5) continue;

        const sx = (halfCols + (x1 * fovX) / depth) | 0;
        const sy = (halfRows - (y2 * fovY) / depth) | 0;
        if (sx >= 0 && sx < COLS && sy >= 0 && sy < ROWS) {
          const idx = sy * COLS + sx;
          if (z2 > zBuf[idx]) {
            zBuf[idx] = z2;
            specialBuf[idx] = p.glyph;
            colorBuf[idx] = p.col;
          }
        }
      }

      // 8. Two-Pass High-DPI ASCII Canvas Rendering
      //    Pass 1: Crisp, unblurred shadow & midtone runs (zero muddy shadow bleed)
      //    Pass 2: Batched luminous highlights, petal rims, baby's breath & sparkles
      bCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      bCtx.clearRect(0, 0, canvasCssW, canvasCssH);

      bCtx.font = `600 ${fontSize}px "Fira Code", "Courier New", monospace`;
      bCtx.textBaseline = 'middle';
      bCtx.textAlign = 'left';
      bCtx.shadowBlur = 0;
      bCtx.shadowColor = 'transparent';

      for (let c = 0; c < glowBuckets.length; c++) glowBuckets[c].length = 0;

      const padX = 3;
      const padY = 3 + cellH * 0.5;

      for (let r = 0; r < ROWS; r++) {
        const rowOffset = r * COLS;
        const py = padY + r * cellH;
        let runStart = -1;
        let runColor = 0;
        let runStr = '';

        for (let c = 0; c < COLS; c++) {
          const idx = rowOffset + c;
          const col = colorBuf[idx];
          if (col === 0) {
            if (runStart !== -1) {
              bCtx.fillStyle = PALETTE[runColor].fill;
              bCtx.fillText(runStr, padX + runStart * cellW, py);
              runStart = -1;
              runStr = '';
            }
            continue;
          }

          const sp = specialBuf[idx];
          const pal = PALETTE[col];

          // Defer glowing or special Unicode cells to Pass 2
          if (pal.blur > 0 || sp > 0) {
            if (runStart !== -1) {
              bCtx.fillStyle = PALETTE[runColor].fill;
              bCtx.fillText(runStr, padX + runStart * cellW, py);
              runStart = -1;
              runStr = '';
            }
            glowBuckets[col].push(c, r, sp > 0 ? -sp : charBuf[idx]);
            continue;
          }

          // Batch contiguous same-color crisp ASCII characters into a single fillText call
          const ch = String.fromCharCode(charBuf[idx]);
          if (col === runColor && runStart !== -1) {
            runStr += ch;
          } else {
            if (runStart !== -1) {
              bCtx.fillStyle = PALETTE[runColor].fill;
              bCtx.fillText(runStr, padX + runStart * cellW, py);
            }
            runStart = c;
            runColor = col;
            runStr = ch;
          }
        }

        if (runStart !== -1) {
          bCtx.fillStyle = PALETTE[runColor].fill;
          bCtx.fillText(runStr, padX + runStart * cellW, py);
        }
      }

      // Pass 2: Draw glowing highlights, petal rims, baby's breath & orbiting sparkles grouped by style
      bCtx.textAlign = 'center';
      for (let col = 1; col < glowBuckets.length; col++) {
        const list = glowBuckets[col];
        if (list.length === 0) continue;
        const pal = PALETTE[col];
        bCtx.fillStyle = pal.fill;
        if (pal.blur > 0) {
          bCtx.shadowColor = pal.glow;
          bCtx.shadowBlur = pal.blur;
        } else {
          bCtx.shadowColor = 'transparent';
          bCtx.shadowBlur = 0;
        }

        for (let k = 0; k < list.length; k += 3) {
          const c = list[k];
          const r = list[k + 1];
          const code = list[k + 2];
          const ch = code < 0 ? UNICODE_TABLE[-code] : String.fromCharCode(code);
          bCtx.fillText(ch, padX + (c + 0.5) * cellW, padY + r * cellH);
        }
      }

      bCtx.shadowBlur = 0;
      requestAnimationFrame(renderFrame);
    }

    // ── Typewriter for Title ──
    const titleEl = document.getElementById('title-line');
    const titleMsg = '✿ a little something i made for the whole night for you, Hany ✿';
    let tIdx = 0;

    setTimeout(function typeTitle() {
      if (tIdx <= titleMsg.length) {
        titleEl.textContent = titleMsg.slice(0, tIdx++);
        setTimeout(typeTitle, 55);
      }
    }, 1400);

    // ── Typewriter for Speech Bubble ──
    const speechEl = document.getElementById('speech-text');
    const speechMsg = 'I really love you Hany ♥';
    let sIdx = 0;

    setTimeout(function typeSpeech() {
      if (sIdx <= speechMsg.length) {
        speechEl.textContent = speechMsg.slice(0, sIdx++);
        setTimeout(typeSpeech, 65);
      }
    }, 2800);

    // ── Ambient Gently Falling ASCII Petals ──
    const petalPool = ['❀', '✿', '❁', '❃', '※', '♥', '✾', '❂'];

    function dropPetal() {
      const p = document.createElement('div');
      p.className = 'falling-petal';
      p.textContent = petalPool[(Math.random() * petalPool.length) | 0];
      p.style.left = Math.random() * 100 + 'vw';
      p.style.fontSize = (Math.random() * 13 + 10) + 'px';
      p.style.animationDuration = (Math.random() * 5 + 6) + 's';
      const hue = 350 + Math.random() * 20 - 10;
      p.style.color = `hsl(${hue}, 85%, ${48 + Math.random() * 20}%)`;
      p.style.textShadow = `0 0 8px hsla(${hue}, 90%, 55%, 0.7)`;
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 12000);
    }

    setInterval(dropPetal, 750);

    // ── Floating Hearts Burst on Click Anywhere ──
    document.addEventListener('click', e => {
      if (suppressNextDocClick) return;
      for (let i = 0; i < 7; i++) {
        const h = document.createElement('div');
        h.className = 'float-heart';
        h.textContent = '♥';
        h.style.left = (e.clientX + (Math.random() - 0.5) * 75) + 'px';
        h.style.top = e.clientY + 'px';
        h.style.fontSize = (Math.random() * 12 + 12) + 'px';
        h.style.color = `hsl(${345 + Math.random() * 20}, 90%, ${50 + Math.random() * 15}%)`;
        h.style.textShadow = '0 0 12px rgba(255, 50, 80, 0.85)';
        h.style.animationDelay = (Math.random() * 0.25) + 's';
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 3600);
      }
    });

    // ── Start Animations on Window Load ──
    window.onload = function () {
      measureAndResizeBouquet();
      requestAnimationFrame(drawStars);
      requestAnimationFrame(renderFrame);
    };
  </script>
</body>
